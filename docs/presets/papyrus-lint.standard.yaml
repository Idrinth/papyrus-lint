# === "standard" preset =========================================================
# A middle ground for most projects. Every rule that can catch a real bug
# or a real performance problem stays on (everything tagged "medium" or
# "high" importance by papyrus-lints' tags module), plus the handful of
# purely mechanical formatting/whitespace rules that are auto-fixable and
# essentially free (trailing whitespace, comma spacing, semicolons,
# indentation, whitespace around `.`/`!`, operator spacing).
#
# Turned off relative to "strict": rules that are purely naming-convention,
# informational, or maintainability-advisory with no correctness/
# performance stake of their own — identifier/type casing, named-argument
# style, property sorting, unused-property/-local-variable/-disable-directive/
# -import advisories, function-override/useless-downcast/stale-compiled-output
# info notices, parameter reassignment, unnecessary-function, and the "call a
# Global via an instance" style nit.
# `unused_getter` stays on: unlike the others in that family, it's tagged
# "correctness" as well as "maintainability" (medium importance), since an
# unused getter can also mean the property it reads was never wired up.
# These are still useful over time, just not on every run.
#
# Selected via `PapyrusLinterCLI init --preset standard` and by the desktop
# app's first-run preset picker for a project with no
# papyrus-lint.yaml/.yml yet. See docs/presets/papyrus-lint.strict.yaml
# (today's built-in default, and `init`'s own default) and
# docs/presets/papyrus-lint.careful.yaml for the other two presets.
#
# This preset has no overrides of its own to list: every "low" importance
# rule is turned off here, except the ones `docs/rules.json` marks
# `kept_in_standard` (the free formatting rules named above) — see
# `papyrus-lint-config/build.rs`, which derives this preset's `rules:`
# section from that file and `docs/papyrus-lint.default.yaml` rather than
# from anything checked in here.
# ===============================================================================
