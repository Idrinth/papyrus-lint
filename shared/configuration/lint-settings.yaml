project_settings:
  - key: compiler_path
    yaml:
      default: 'null'
      comment: "Path to PapyrusCompiler.exe, or null to auto-detect it"
    schema:
      description: "Path to PapyrusCompiler.exe, or null/omit to auto-detect it."
      type:
        - string
        - 'null'
      default: null
  - key: additional_script_roots
    yaml:
      default: '[]'
      comment: "Extra directories (relative to the project root, or absolute) to search\nfor .psc files, besides scripts/source and source/scripts"
    schema:
      description: "Extra directories (relative to the project root, or absolute) to search for .psc files, besides scripts/source and source/scripts. Used for linting, cross-script resolution, and the compiler -i path."
      type: array
      items:
        type: string
        minLength: 1
      default: []
  - key: lookup_script_roots
    yaml:
      default: '[]'
      comment: "Extra directories searched only as a fallback when resolving other\nscripts for analysis (argument/return types, Extends, autocompletion).\nScripts found only here are never linted, and these directories are\nignored by conflicting-script-versions"
    schema:
      description: "Extra directories searched only as a fallback when resolving other scripts for analysis (argument/return types, Extends, autocompletion). Scripts found only here are never linted, and these directories are ignored by conflicting-script-versions."
      type: array
      items:
        type: string
        minLength: 1
      default: []
  - key: compile_check
    yaml:
      default: 'false'
      comment: "true, false; also runs PapyrusCompiler.exe (into a throwaway temporary\ndirectory) as part of linting a dropped .psc, reporting its errors\nalongside the lint engine's own. Requires compiler_path to be set/\nauto-detected"
    schema:
      description: "Also run PapyrusCompiler.exe (into a throwaway temporary directory) as part of linting a .psc, reporting its errors alongside the lint engine. Requires compiler_path to be set or auto-detected."
      type: boolean
      default: false
  - key: strict_achlist_scope
    yaml:
      default: 'false'
      comment: "true enables strict cross-script resolution and conflicting-script-versions\nchecks for only the achlist's listed entries. false (the default) keeps\nparent-directory search roots. In strict mode, every .psc dependency must\nbe listed in the achlist"
    schema:
      description: "When true, restrict cross-script resolution and conflicting-script-versions to an achlist's listed entries only. When false (the default), parent directories of listed entries are also search roots."
      type: boolean
      default: false
rules_yaml_comment: Each rule accepts true or false
settings:
  - key: game
    rust:
      type: Game
      default: Game::default()
    yaml:
      default: skyrim
      comment: "Target game. Currently supported: skyrim, fallout4, starfield"
    ts_type: Game
    ts_alias: Game
    doc: "The game whose Papyrus dialect and runtime APIs this project targets.\nDefaults to [`Game::Skyrim`] for compatibility with configurations\ncreated before this key existed."
    ui:
      mount: lint-config-game
      id: game-select
      widget: game
      label: Target game
      title: Target game
      options:
        - value: skyrim
          label: Skyrim
        - value: fallout4
          label: Fallout 4
        - value: starfield
          label: Starfield
      fill_selects:
        - config-picker-game-select
    schema:
      description: "Game whose Papyrus dialect and runtime APIs the project targets."
      type: string
      enum:
        - skyrim
        - fallout4
        - starfield
      default: skyrim
  - key: semicolon
    rust:
      type: bool
      default: 'false'
    yaml:
      default: 'false'
      comment: "true, false"
    ts_type: boolean
    doc: "Whether lines are required to end in a semicolon (`true`) or must\nnot (`false`). See the \"Semicolon at end of line\" lint in\nREADME.md."
    ui:
      mount: lint-config-settings
      id: semicolon-style
      widget: bool-select
      label: Trailing semicolons
      true_value: require
      false_value: forbid
      options:
        - value: forbid
          label: Remove where possible
        - value: require
          label: Add to non-empty lines
    schema:
      description: "Whether lines are required to end in a semicolon (true) or must not (false)."
      type: boolean
      default: false
  - key: indentation
    rust:
      type: Indentation
      default: Indentation::default()
    yaml:
      default: tab
      comment: "tab, space"
    ts_type: '"tab" | "space"'
    doc: "The indentation style enforced by the \"Formatting checks\"/\n\"Indentation\" lint and automatic fix in README.md."
    ui:
      mount: lint-config-settings
      group: indentation
      group_kind: indentation
      group_prefix: Indentation
      id: indentation-style
      widget: mapped-select
      aria_label: Indentation style
      options:
        - value: tabs
          label: Tabs
          config: tab
        - value: spaces
          label: Spaces
          config: space
      enables_key: indentation_width
      enables_when: space
    schema:
      description: "Expected indentation style, read by the indentation lint and automatic fix."
      type: string
      enum:
        - tab
        - space
      default: tab
  - key: indentation_width
    rust:
      type: usize
      default: '4'
    yaml:
      default: '4'
      comment: "Non-negative integer; used only when indentation is space"
    ts_type: number
    doc: "The number of spaces per indentation level, used only when\n`indentation` is [`Indentation::Space`]."
    ui:
      mount: lint-config-settings
      group: indentation
      group_kind: indentation
      id: indentation-width
      widget: number
      label: Width
      min: 1
      max: 16
      clamp_min: 1
      clamp_max: 16
      treat_zero_as_empty: true
      disabled_by_default: true
    schema:
      description: "Spaces per indentation level. Used only when indentation is space. The engine clamps this to 1..16."
      type: integer
      minimum: 1
      maximum: 16
      default: 4
  - key: max_line_length
    rust:
      type: usize
      default: '120'
    yaml:
      default: '120'
      comment: "Non-negative integer; maximum characters allowed on one line"
    ts_type: number
    doc: "The maximum number of characters allowed on a line before the\n\"Line length\" lint emits a warning."
    ui:
      mount: lint-config-settings
      id: max-line-length
      widget: number
      label: Maximum line length
      min: 1
      clamp_min: 1
      treat_zero_as_empty: true
    schema:
      description: "Non-negative integer; maximum characters allowed on one line"
      type: integer
      minimum: 0
      default: 120
  - key: type_casing
    rust:
      type: TypeCasing
      default: TypeCasing::default()
    yaml:
      default: PascalCase
      comment: "PascalCase, camelCase, lowercase, UPPERCASE"
    ts_type: TypeCasingStyle
    ts_alias: TypeCasingStyle
    doc: "The casing convention required of a script's declared type name\n(the identifier following `ScriptName`), checked by the \"Type name\ncasing\" lint."
    ui:
      mount: lint-config-settings
      id: type-casing-style
      widget: select
      label: Type name casing
      options:
        - value: PascalCase
          label: PascalCase
        - value: camelCase
          label: camelCase
        - value: lowercase
          label: lowercase
        - value: UPPERCASE
          label: UPPERCASE
    schema:
      description: "Casing convention for a script's declared type name (the identifier following ScriptName)."
      type: string
      enum:
        - PascalCase
        - camelCase
        - lowercase
        - UPPERCASE
      default: PascalCase
  - key: identifier_casing
    rust:
      type: IdentifierCasing
      default: IdentifierCasing::default()
    yaml:
      default: PascalCase
      comment: "camelCase, PascalCase, snake_case, CONSTANT_CASE"
    ts_type: IdentifierCasingStyle
    ts_alias: IdentifierCasingStyle
    doc: "The casing style enforced by the \"Identifier casing\" lint. See\n[`IdentifierCasing`]."
    ui:
      mount: lint-config-settings
      id: identifier-casing-style
      widget: select
      label: Identifier casing
      options:
        - value: camelCase
          label: camelCase
        - value: PascalCase
          label: PascalCase
        - value: snake_case
          label: snake_case
        - value: CONSTANT_CASE
          label: CONSTANT_CASE
    schema:
      description: "Casing style declared identifiers must match (functions, events, properties, states, parameters, locals)."
      type: string
      enum:
        - camelCase
        - PascalCase
        - snake_case
        - CONSTANT_CASE
      default: PascalCase
  - key: named_arguments
    rust:
      type: NamedArguments
      default: NamedArguments::default()
    yaml:
      default: never
      comment: "always, instead_of_defaults, never"
    ts_type: NamedArgumentsStyle
    ts_alias: NamedArgumentsStyle
    doc: "How strongly the \"Prefer named arguments\" lint prefers Papyrus's\nnamed-argument call syntax (`func(argB = 1)`) over positional\narguments. See [`NamedArguments`]."
    ui:
      mount: lint-config-settings
      id: named-arguments-style
      widget: select
      label: Prefer named arguments
      options:
        - value: never
          label: Never
        - value: instead_of_defaults
          label: Instead of defaults
        - value: always
          label: Always
    schema:
      description: "How strongly a positional call argument should be passed by name instead."
      type: string
      enum:
        - always
        - instead_of_defaults
        - never
      default: never
  - key: magic_numbers
    rust:
      type: MagicNumbers
      default: MagicNumbers::default()
    yaml:
      default: loose
      comment: "loose, strict"
    ts_type: MagicNumbersMode
    ts_alias: MagicNumbersMode
    doc: "Whether the \"Magic numbers\" lint also checks the interval argument\nof a `Utility.Wait`/`RegisterForUpdate`/`RegisterForSingleUpdate`/\n`RegisterForUpdateGameTime`/`RegisterForSingleUpdateGameTime` call\n(`strict`), or leaves it unflagged since a hardcoded interval there\nis common and usually self-explanatory (`loose`, the default). See\n[`MagicNumbers`]."
    ui:
      mount: lint-config-settings
      id: magic-numbers-mode
      widget: select
      label: Magic numbers
      options:
        - value: loose
          label: Loose (exempt Wait/RegisterFor* intervals)
        - value: strict
          label: Strict (check every call argument)
    schema:
      description: "Whether the magic-numbers lint also flags Wait/RegisterFor* interval arguments (strict) or leaves them unflagged (loose)."
      type: string
      enum:
        - loose
        - strict
      default: loose
  - key: cyclomatic_complexity_warning
    rust:
      type: usize
      default: '10'
    yaml:
      default: '10'
      comment: "Non-negative integer"
    ts_type: number
    doc: "The cyclomatic complexity a function/event can reach before the\n\"Cyclomatic complexity\" lint flags it as a `[warning]`."
    ui:
      mount: lint-config-settings
      group: cyclomatic
      group_kind: fieldset
      group_legend: Cyclomatic complexity thresholds
      row: true
      id: cyclomatic-complexity-warning
      widget: number
      label: Warning at
      min: 1
      clamp_min: 1
      treat_zero_as_empty: true
    schema:
      description: "Cyclomatic complexity at which the cyclomatic-complexity lint reports a warning."
      type: integer
      minimum: 0
      default: 10
  - key: cyclomatic_complexity_error
    rust:
      type: usize
      default: '20'
    yaml:
      default: '20'
      comment: "Non-negative integer"
    ts_type: number
    doc: "The cyclomatic complexity a function/event can reach before the\n\"Cyclomatic complexity\" lint flags it as an `[error]`. A value below\n[`Self::cyclomatic_complexity_warning`] is treated as equal to it\ninstead (see [`crate::cyclomatic_complexity::check`]), since an\n`[error]` threshold lower than the `[warning]` one it's supposed to\nescalate would otherwise be contradictory."
    ui:
      mount: lint-config-settings
      group: cyclomatic
      group_kind: fieldset
      row: true
      id: cyclomatic-complexity-error
      widget: number
      label: Error at
      min: 1
      clamp_min: 1
      clamp_min_from: cyclomatic_complexity_warning
      treat_zero_as_empty: true
    schema:
      description: "Cyclomatic complexity at which the cyclomatic-complexity lint reports an error. A value below cyclomatic_complexity_warning is treated as equal to it."
      type: integer
      minimum: 0
      default: 20
  - key: min_wait_interval
    rust:
      type: f64
      default: '0.1'
    yaml:
      default: '0.1'
      comment: "Non-negative number"
    ts_type: number
    doc: "The interval/duration argument a `Utility.Wait`, `RegisterForUpdate`,\n`RegisterForSingleUpdate`, `RegisterForUpdateGameTime`, or\n`RegisterForSingleUpdateGameTime` call can go below before the\n\"Short wait/update interval\" lint flags it as a `[warning]`."
    ui:
      mount: lint-config-settings
      group: wait
      group_kind: fieldset
      group_legend: Short wait/update interval threshold
      row: true
      id: min-wait-interval
      widget: number
      label: Minimum interval
      min: 0
      step: 0.01
      clamp_min: 0
    schema:
      description: "Interval/duration argument a Utility.Wait / RegisterForUpdate / RegisterForSingleUpdate / RegisterForUpdateGameTime / RegisterForSingleUpdateGameTime call can go below before short-wait-interval flags it."
      type: number
      minimum: 0
      default: 0.1
  - key: fail_on_warning
    rust:
      type: bool
      default: 'false'
    yaml:
      default: 'false'
      comment: "true, false"
    ts_type: boolean
    doc: "Whether the CLI (see `papyrus-lint-cli`) treats a `[warning]`-level\ndiagnostic as a reason to exit non-zero. `false` by default, so a\nproject only fails a lint run on `[error]`-level (and untagged)\ndiagnostics unless it opts in. Has no effect on the desktop app,\nwhich always shows every diagnostic regardless of severity."
    ui:
      mount: lint-config-settings
      group: fail-levels
      group_kind: fieldset
      group_legend: CLI failure levels
      id: fail-on-warning
      widget: checkbox
      checkbox_label: Fail on warning
      title: fail_on_warning
    schema:
      description: "Whether the CLI treats a warning-level diagnostic as a non-zero exit. Has no effect on the desktop app."
      type: boolean
      default: false
  - key: fail_on_info
    rust:
      type: bool
      default: 'false'
    yaml:
      default: 'false'
      comment: "true, false"
    ts_type: boolean
    doc: "Like [`Self::fail_on_warning`], but for `[info]`-level diagnostics.\n`false` by default."
    ui:
      mount: lint-config-settings
      group: fail-levels
      group_kind: fieldset
      id: fail-on-info
      widget: checkbox
      checkbox_label: Fail on info
      title: fail_on_info
    schema:
      description: "Whether the CLI treats an info-level diagnostic as a non-zero exit. Has no effect on the desktop app."
      type: boolean
      default: false
  - key: bool_like_int
    rust:
      type: bool
      default: 'true'
    yaml:
      default: 'true'
      comment: "true, false"
    ts_type: boolean
    doc: "Whether the \"Strict boolean check\" lint accepts an `Int` literal\n`1` or `0` used directly as an `If`/`ElseIf`/`While` condition,\ntreating it as the common \"bool-like\" idiom rather than flagging\nit. `true` by default. Any other `Int` value (a variable, a\nproperty, or a literal other than `1`/`0`) is still flagged\nregardless of this setting."
    ui:
      mount: lint-config-settings
      group: bool-like
      group_kind: fieldset
      group_legend: Strict boolean check
      id: bool-like-int
      widget: checkbox
      checkbox_label: Allow 1/0 as bool-like
      title: bool_like_int
    schema:
      description: "Whether strict-boolean accepts the Int literals 1 and 0 used directly as If/ElseIf/While conditions."
      type: boolean
      default: true
  - key: treat_form_as_bool_for_returns
    rust:
      type: bool
      default: 'false'
    yaml:
      default: 'false'
      comment: "true allows a Bool function to return a non-array Form value, relying on\nPapyrus to treat None as false and an existing Form as true"
    ts_type: boolean
    doc: "Whether the \"Return type check\" lint accepts a non-array Form\nvalue returned from a `Bool` function. Papyrus implicitly treats\n`None` as false and an existing Form as true, but this common idiom\nis rejected by default so return types remain strict unless a\nproject explicitly opts in."
    ui:
      mount: lint-config-settings
      group: treat-form-as-bool
      group_kind: fieldset
      group_legend: Return type check
      id: treat-form-as-bool-for-returns
      widget: checkbox
      checkbox_label: Treat Forms as Bool for returns
      title: treat_form_as_bool_for_returns
    schema:
      description: "Whether return-types accepts a non-array Form value returned from a Bool function, relying on Papyrus's implicit None/existing Form conversion."
      type: boolean
      default: false
  - key: assume_auto_properties_filled
    rust:
      type: bool
      default: 'false'
    yaml:
      default: 'false'
      comment: "true, false; true treats an Auto/AutoReadOnly property as already\nfilled in by the time a function runs instead of possibly None"
    ts_type: boolean
    doc: "Whether the \"None used as an existing Form\" lint treats a\nscript-level `Auto`/`AutoReadOnly` property as already filled in by\nthe time a function runs, rather than possibly still `None` (see\n[`crate::none_form_usage`]). `false` by default, so such a property\nis treated the same as an uninitialized local unless proven\notherwise. Many projects consider that noise, since in practice the\nCK's Property Manager (or another script's `PropertySet`) has\nalready filled every listed property in by the time any function\nruns; setting this to `true` drops that initial assumption. A\nproperty is still tracked (and flagged) once script code assigns it\n`None` directly, the same as a local variable. Has no effect on\n`unchecked_form_parameter`, which never tracks properties at all."
    ui:
      mount: lint-config-settings
      group: assume-auto
      group_kind: fieldset
      group_legend: None used as an existing Form
      id: assume-auto-properties-filled
      widget: checkbox
      checkbox_label: Assume Auto properties are filled
      title: assume_auto_properties_filled
    schema:
      description: "Whether none-form-usage treats a script-level Auto/AutoReadOnly property as already filled in by the time a function runs, instead of possibly None."
      type: boolean
      default: false
