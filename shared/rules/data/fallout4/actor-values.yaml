# Fallout 4's built-in Actor Values, per the Creation Kit / console AV
# names and the hardcoded AVIF records shipped with the game. Compiled
# in by papyrus-lint-core's build.rs for the "Unknown Actor Value" lint
# (see ../app/crates/papyrus-lints/src/actor_value.rs), which flags a
# string literal passed to an Actor Value function that doesn't match a
# name listed here — a strong signal of a typo. Fallout 4's Papyrus API
# usually takes an `ActorValue` form rather than a string (ObjectReference
# GetValue/SetValue/ModValue/DamageValue/RestoreValue), so this lint is
# disabled by default (see rules.unknown_actor_value). A mod-added Actor
# Value defined by a project's own plugin has no way to appear here.
#
# Sourced from `shared/scripts/fallout4-scripts.zip` (Game.Get*AV helpers
# and ActorValue property names on base scripts) together with the
# engine's hardcoded AVIF editor IDs.
#
# Each entry is the Actor Value's own case-insensitive name, exactly as
# passed to an Actor Value function or used as the AVIF editor ID.

# S.P.E.C.I.A.L.
- Strength
- Perception
- Endurance
- Charisma
- Intelligence
- Agility
- Luck

