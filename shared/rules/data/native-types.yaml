# Fallback knowledge of the native (engine-defined) Papyrus class hierarchy,
# for papyrus-lint-core's `FunctionTable::is_subtype` (used by the
# "Argument type check"/"Return type check" lints).
#
# Types like `Form`, `ObjectReference`, `Actor`, `MagicItem`, or `Spell` are
# defined by the game engine itself: their `Extends` relationship comes from
# a `.psc` source file the game ships (e.g. `Actor.psc extends
# ObjectReference`), not from anything in the mod project being linted. Most
# projects don't carry copies of those engine scripts under their own
# `scripts/source`/`source/scripts`, so the linter can't find them to parse
# an `Extends` chain from — without this table, a perfectly legal upcast
# (e.g. passing an `Actor` where an `ObjectReference` is expected) would be
# flagged as a type mismatch.
#
# Each entry:
#   type:    a native engine type name
#   extends: that type's immediate parent in the native class hierarchy
#
# Deliberately not exhaustive: this only needs to cover the common types
# shared by Skyrim and Fallout 4. A type not listed here (including one the
# linter simply has no data for, e.g. a game-specific or SKSE/F4SE-added
# type) resolves to "unknown, don't guess", same as before this table
# existed.

- type: ObjectReference
  extends: Form

- type: Actor
  extends: ObjectReference

- type: Hazard
  extends: ObjectReference

- type: MagicItem
  extends: Form

- type: Spell
  extends: MagicItem

- type: Scroll
  extends: MagicItem

- type: Ingredient
  extends: MagicItem

- type: Potion
  extends: MagicItem

- type: Ammo
  extends: Form

