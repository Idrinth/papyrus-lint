# Native events Bethesda's engine invokes directly with a fixed argument
# list, per the CreationKit wiki (https://ck.uesp.net/wiki). Compiled in by
# papyrus-lints/build.rs for the "Event signature mismatch" lint (see
# ../app/crates/papyrus-lints/src/event_signature.rs), which flags an
# `Event` declaration whose name matches one of these but whose parameter
# list doesn't match the signature listed here. Papyrus itself never
# validates an `Event`'s signature against what the engine actually calls
# it with, so a mismatched declaration still compiles fine — the engine
# just never invokes it (or invokes it with arguments the script doesn't
# expect), silently dropping that event instead of raising any kind of
# error.
#
# Each entry:
#   event: the Event's own name, exactly as the engine calls it (matched
#          case-insensitively against a declared `Event`'s name)
#   form:  the script/Form that first declares this event; a script whose
#          `Extends` chain reaches this Form (directly or transitively) may
#          declare/override it
#   args:  the event's exact parameter list, in order; each entry is the
#          parameter's Papyrus type and its own conventional name (matched
#          by type only, case-insensitively — parameter names are free to
#          differ)

- event: OnInit
  form: ScriptObject
  args: []

- event: OnLoad
  form: ObjectReference
  args: []

- event: OnUnload
  form: ObjectReference
  args: []

- event: OnReset
  form: ObjectReference
  args: []

- event: OnActivate
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnHit
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akAggressor
    - type: Form
      name: akSource
    - type: Projectile
      name: akProjectile
    - type: Bool
      name: abPowerAttack
    - type: Bool
      name: abSneakAttack
    - type: Bool
      name: abBashAttack
    - type: Bool
      name: abHitBlocked

- event: OnMagicEffectApply
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akCaster
    - type: MagicEffect
      name: akEffect

- event: OnItemAdded
  form: ObjectReference
  args:
    - type: Form
      name: akBaseItem
    - type: Int
      name: aiItemCount
    - type: ObjectReference
      name: akItemReference
    - type: ObjectReference
      name: akSourceContainer

- event: OnItemRemoved
  form: ObjectReference
  args:
    - type: Form
      name: akBaseItem
    - type: Int
      name: aiItemCount
    - type: ObjectReference
      name: akItemReference
    - type: ObjectReference
      name: akDestContainer

- event: OnTrigger
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnTriggerEnter
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnTriggerLeave
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnOpen
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnClose
  form: ObjectReference
  args:
    - type: ObjectReference
      name: akActionRef

- event: OnGrab
  form: ObjectReference
  args: []

- event: OnRelease
  form: ObjectReference
  args: []

- event: OnCellLoad
  form: ObjectReference
  args: []

- event: OnCellAttach
  form: ObjectReference
  args: []

- event: OnCellDetach
  form: ObjectReference
  args: []

- event: OnDeath
  form: Actor
  args:
    - type: Actor
      name: akKiller

- event: OnCombatStateChanged
  form: Actor
  args:
    - type: Actor
      name: akTarget
    - type: Int
      name: aeCombatState

- event: OnLocationChange
  form: Actor
  args:
    - type: Location
      name: akOldLoc
    - type: Location
      name: akNewLoc

- event: OnObjectEquipped
  form: Actor
  args:
    - type: Form
      name: akBaseObject
    - type: ObjectReference
      name: akReference

- event: OnObjectUnequipped
  form: Actor
  args:
    - type: Form
      name: akBaseObject
    - type: ObjectReference
      name: akReference

- event: OnEquipped
  form: Form
  args:
    - type: Actor
      name: akActor

- event: OnUnequipped
  form: Form
  args:
    - type: Actor
      name: akActor

- event: OnSell
  form: Form
  args:
    - type: Actor
      name: akSeller

- event: OnEffectStart
  form: ActiveMagicEffect
  args:
    - type: Actor
      name: akTarget
    - type: Actor
      name: akCaster

- event: OnEffectFinish
  form: ActiveMagicEffect
  args:
    - type: Actor
      name: akTarget
    - type: Actor
      name: akCaster
