<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papyrus Lint</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Papyrus Lint <span id="app-version" class="app-version"></span></h1>

      <div class="tabs">
        <div class="tabs__list" role="tablist">
          <button type="button" id="tab-import" class="tabs__tab" role="tab" aria-controls="panel-import" aria-selected="true">
            Import
          </button>
          <button type="button" id="tab-settings" class="tabs__tab" role="tab" aria-controls="panel-settings" aria-selected="false">
            Settings
          </button>
          <button type="button" id="tab-files" class="tabs__tab" role="tab" aria-controls="panel-files" aria-selected="false">
            Files
          </button>
          <button type="button" id="tab-lint" class="tabs__tab" role="tab" aria-controls="panel-lint" aria-selected="false">
            Lint results
          </button>
        </div>

        <div id="panel-import" class="tabs__panel" role="tabpanel" aria-labelledby="tab-import">
          <div id="drop-zone" class="drop-zone">
            <p class="drop-zone__hint">Drag and drop an .achlist file here to get started</p>
            <p id="drop-zone-error" class="drop-zone__error" aria-live="polite"></p>
          </div>
        </div>

        <div id="panel-settings" class="tabs__panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <div class="compiler-path-setting">
            <label for="compiler-path">PapyrusCompiler.exe path</label>
            <input
              id="compiler-path"
              type="text"
              placeholder="Auto-detected from ../Papyrus Compiler if left blank"
            />
          </div>
          <label for="semicolon-style">Trailing semicolons</label>
          <select id="semicolon-style">
            <option value="forbid">Remove where possible</option>
            <option value="require">Add to non-empty lines</option>
          </select>
          <div class="indentation-setting">
            Indentation
            <select id="indentation-style" aria-label="Indentation style">
              <option value="tabs">Tabs</option>
              <option value="spaces">Spaces</option>
            </select>
            <label for="indentation-width">Width</label>
            <input id="indentation-width" type="number" min="1" max="16" value="4" disabled />
          </div>

          <fieldset class="settings-group">
            <legend>Cyclomatic complexity thresholds</legend>
            <div class="settings-group__row">
              <label for="cyclomatic-complexity-warning">Warning at</label>
              <input id="cyclomatic-complexity-warning" type="number" min="1" value="10" />
            </div>
            <div class="settings-group__row">
              <label for="cyclomatic-complexity-error">Error at</label>
              <input id="cyclomatic-complexity-error" type="number" min="1" value="20" />
            </div>
          </fieldset>

          <fieldset id="lint-rules" class="settings-group">
            <legend>Lint rules</legend>
            <label title="Flags lines that end with trailing spaces or tabs."><input type="checkbox" id="rule-trailing_whitespace" checked /> Trailing whitespace</label>
            <label title="Requires whitespace after commas in argument lists."><input type="checkbox" id="rule-comma_spacing" checked /> Space after comma</label>
            <label title="Flags calls to functions marked as forbidden or discouraged (e.g. slow or blocking native calls), with an explanatory message per function."><input type="checkbox" id="rule-forbidden_functions" checked /> Forbidden/discouraged function usage</label>
            <label title="Flags calls to functions that have a faster equivalent available, and suggests the quicker alternative."><input type="checkbox" id="rule-slow_functions" checked /> Slow function usage</label>
            <label title="Flags standalone calls to functions whose names begin with &quot;Get&quot;, since their return value is discarded."><input type="checkbox" id="rule-unused_getter" checked /> Getter usage without saving result</label>
            <label title="Flags Property declarations whose name is never referenced anywhere else in the script."><input type="checkbox" id="rule-unused_property" checked /> Unused script properties</label>
            <label title="Requires a trailing semicolon on each non-empty line, or forbids terminal semicolons, according to the &quot;Trailing semicolons&quot; setting above."><input type="checkbox" id="rule-semicolon" checked /> Semicolon at end of line</label>
            <label title="Flags a Float value assigned, returned, or passed where an Int is expected without an explicit &quot;as Int&quot; cast."><input type="checkbox" id="rule-float_int_conversion" checked /> Implicit Float-to-Int conversion</label>
            <label title="Flags If/ElseIf/While conditions that aren't already a Bool value or expression, instead of relying on implicit conversion to boolean."><input type="checkbox" id="rule-strict_boolean" checked /> Strict boolean check</label>
            <label title="Flags call-site arguments whose type doesn't match the callee's declared parameter type (e.g. passing a String where an Int is expected)."><input type="checkbox" id="rule-argument_types" checked /> Argument type check</label>
            <label title="Flags a function declared on this script that shares its name with one declared on the script's Extends chain, since the local declaration overrides the inherited one."><input type="checkbox" id="rule-function_override" checked /> Inherited function override</label>
            <label title="Flags implicit comparisons (==, !=, <, <=, >, >=) between an Int and a Float value without an explicit cast making the comparison exact."><input type="checkbox" id="rule-numeric_comparison" checked /> Strict numeric type check</label>
            <label title="Flags lines whose indentation doesn't match the configured style/width for their nesting depth."><input type="checkbox" id="rule-indentation" checked /> Formatting checks / Indentation</label>
            <label title="Flags functions/events whose cyclomatic complexity exceeds the configured warning/error thresholds above."><input type="checkbox" id="rule-cyclomatic_complexity" checked /> Cyclomatic complexity</label>
            <label title="Flags statements that follow a Return within the same block, since they can never execute."><input type="checkbox" id="rule-unreachable_statement" checked /> Unreachable statement</label>
            <label title="Flags If/ElseIf/While conditions that fold to a constant true or false regardless of any runtime state (e.g. &quot;If true&quot;, &quot;If 1 == 2&quot;)."><input type="checkbox" id="rule-static_condition" checked /> Static condition</label>
            <label title="Flags local variables that are declared but never read again, or only ever assigned a new value without that value ever being read."><input type="checkbox" id="rule-unused_local_variable" checked /> Unused or write-only local variables</label>
            <label title="Flags a member/method access (e.g. a.GetName()) on a local variable that's still known to be None at that point, since that crashes the script."><input type="checkbox" id="rule-none_form_usage" checked /> None used as an existing Form</label>
            <label title="Flags a local variable whose name matches a Property declared on the same script or a parent script, since referencing that name then reads the local rather than the property."><input type="checkbox" id="rule-local_variable_shadowing" checked /> Local variable shadowing</label>
          </fieldset>
        </div>

        <div id="panel-files" class="tabs__panel" role="tabpanel" aria-labelledby="tab-files" hidden>
          <div id="achlist-result" class="achlist-result" hidden>
            <h2 id="achlist-result-title"></h2>
            <ul id="achlist-result-list"></ul>
          </div>
        </div>

        <div id="panel-lint" class="tabs__panel" role="tabpanel" aria-labelledby="tab-lint" hidden>
          <div id="psc-result" class="psc-result" hidden>
            <h2>Parsed scripts</h2>
            <fieldset id="psc-result-filters" class="psc-result__filters">
              <legend>Show severities</legend>
              <label><input type="checkbox" id="filter-error" checked /> Errors</label>
              <label><input type="checkbox" id="filter-warning" checked /> Warnings</label>
              <label><input type="checkbox" id="filter-info" checked /> Info</label>
              <label><input type="checkbox" id="filter-other" checked /> Other</label>
            </fieldset>
            <ul id="psc-result-list"></ul>
          </div>
        </div>
      </div>
    </main>

    <dialog id="code-viewer" class="code-viewer">
      <div class="code-viewer__header">
        <h2 id="code-viewer-title" class="code-viewer__title"></h2>
        <div class="code-viewer__actions">
          <button type="button" id="code-viewer-edit" class="code-viewer__action">Edit</button>
          <button type="button" id="code-viewer-save" class="code-viewer__action" hidden>Save</button>
          <button type="button" id="code-viewer-cancel" class="code-viewer__action" hidden>Cancel</button>
        </div>
        <button
          type="button"
          id="code-viewer-fullscreen"
          class="code-viewer__fullscreen"
          aria-label="Enter fullscreen"
          aria-pressed="false"
        >
          &#9974;
        </button>
        <button type="button" id="code-viewer-close" class="code-viewer__close" aria-label="Close">
          &times;
        </button>
      </div>
      <div id="code-viewer-body" class="code-viewer__body">
        <div id="code-viewer-view" class="code-viewer__view"></div>
        <div id="code-viewer-editor" class="code-viewer__editor" hidden>
          <pre id="code-viewer-editor-highlight" class="code-viewer__editor-highlight" aria-hidden="true"><code></code></pre>
          <textarea
            id="code-viewer-editor-textarea"
            class="code-viewer__editor-textarea"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            wrap="off"
          ></textarea>
          <ul id="code-viewer-autocomplete" class="code-viewer__autocomplete" role="listbox" hidden></ul>
        </div>
      </div>
    </dialog>
  </body>
</html>
