<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>papyrus-lint</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>papyrus-lint</h1>

      <div class="tabs">
        <div class="tabs__list" role="tablist">
          <button type="button" id="tab-import" class="tabs__tab" role="tab" aria-controls="panel-import" aria-selected="true">
            Import
          </button>
          <button type="button" id="tab-settings" class="tabs__tab" role="tab" aria-controls="panel-settings" aria-selected="false">
            Settings
          </button>
          <button type="button" id="tab-files" class="tabs__tab" role="tab" aria-controls="panel-files" aria-selected="false">
            Files
          </button>
          <button type="button" id="tab-lint" class="tabs__tab" role="tab" aria-controls="panel-lint" aria-selected="false">
            Lint results
          </button>
        </div>

        <div id="panel-import" class="tabs__panel" role="tabpanel" aria-labelledby="tab-import">
          <div id="drop-zone" class="drop-zone">
            <p class="drop-zone__hint">Drag and drop an .achlist file here to get started</p>
            <p id="drop-zone-error" class="drop-zone__error" aria-live="polite"></p>
          </div>
        </div>

        <div id="panel-settings" class="tabs__panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <label for="semicolon-style">Trailing semicolons</label>
          <select id="semicolon-style">
            <option value="forbid">Remove where possible</option>
            <option value="require">Add to non-empty lines</option>
          </select>
          <div class="indentation-setting">
            Indentation
            <select id="indentation-style" aria-label="Indentation style">
              <option value="tabs">Tabs</option>
              <option value="spaces">Spaces</option>
            </select>
            <label for="indentation-width">Width</label>
            <input id="indentation-width" type="number" min="1" max="16" value="4" disabled />
          </div>

          <fieldset class="settings-group">
            <legend>Cyclomatic complexity thresholds</legend>
            <div class="settings-group__row">
              <label for="cyclomatic-complexity-warning">Warning at</label>
              <input id="cyclomatic-complexity-warning" type="number" min="1" value="10" />
            </div>
            <div class="settings-group__row">
              <label for="cyclomatic-complexity-error">Error at</label>
              <input id="cyclomatic-complexity-error" type="number" min="1" value="20" />
            </div>
          </fieldset>

          <fieldset id="lint-rules" class="settings-group">
            <legend>Lint rules</legend>
            <label><input type="checkbox" id="rule-trailing_whitespace" checked /> Trailing whitespace</label>
            <label><input type="checkbox" id="rule-comma_spacing" checked /> Space after comma</label>
            <label><input type="checkbox" id="rule-forbidden_functions" checked /> Forbidden/discouraged function usage</label>
            <label><input type="checkbox" id="rule-slow_functions" checked /> Slow function usage</label>
            <label><input type="checkbox" id="rule-unused_getter" checked /> Getter usage without saving result</label>
            <label><input type="checkbox" id="rule-unused_property" checked /> Unused script properties</label>
            <label><input type="checkbox" id="rule-semicolon" checked /> Semicolon at end of line</label>
            <label><input type="checkbox" id="rule-float_int_conversion" checked /> Implicit Float-to-Int conversion</label>
            <label><input type="checkbox" id="rule-strict_boolean" checked /> Strict boolean check</label>
            <label><input type="checkbox" id="rule-argument_types" checked /> Argument type check</label>
            <label><input type="checkbox" id="rule-numeric_comparison" checked /> Strict numeric type check</label>
            <label><input type="checkbox" id="rule-indentation" checked /> Formatting checks / Indentation</label>
            <label><input type="checkbox" id="rule-cyclomatic_complexity" checked /> Cyclomatic complexity</label>
          </fieldset>
        </div>

        <div id="panel-files" class="tabs__panel" role="tabpanel" aria-labelledby="tab-files" hidden>
          <div id="achlist-result" class="achlist-result" hidden>
            <h2 id="achlist-result-title"></h2>
            <ul id="achlist-result-list"></ul>
          </div>
        </div>

        <div id="panel-lint" class="tabs__panel" role="tabpanel" aria-labelledby="tab-lint" hidden>
          <div id="psc-result" class="psc-result" hidden>
            <h2>Parsed scripts</h2>
            <fieldset id="psc-result-filters" class="psc-result__filters">
              <legend>Show severities</legend>
              <label><input type="checkbox" id="filter-error" checked /> Errors</label>
              <label><input type="checkbox" id="filter-warning" checked /> Warnings</label>
              <label><input type="checkbox" id="filter-info" checked /> Info</label>
              <label><input type="checkbox" id="filter-other" checked /> Other</label>
            </fieldset>
            <ul id="psc-result-list"></ul>
          </div>
        </div>
      </div>
    </main>

    <dialog id="code-viewer" class="code-viewer">
      <div class="code-viewer__header">
        <h2 id="code-viewer-title" class="code-viewer__title"></h2>
        <button type="button" id="code-viewer-close" class="code-viewer__close" aria-label="Close">
          &times;
        </button>
      </div>
      <div id="code-viewer-body" class="code-viewer__body"></div>
    </dialog>
  </body>
</html>
