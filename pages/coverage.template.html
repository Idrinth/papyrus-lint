    <script>
      (function () {
        try {
          var theme = localStorage.getItem("papyrus-lint:theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (error) {
          /* localStorage unavailable (e.g. disabled); fall back to the
             system theme via the CSS media query. */
        }
      })();
    </script>
