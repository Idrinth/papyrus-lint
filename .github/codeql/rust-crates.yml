name: "CodeQL rust config: app/crates"

# Splits the rust CodeQL analysis in two so it can run in parallel (see
# .github/workflows/codeql.yml) — this half covers the reusable crates only.
# Trade-off: analysis that depends on data flowing between app/crates and
# app/src-tauri (which depends on these crates) is not visible to this
# half, since app/src-tauri is excluded here and analyzed as its own
# database.
paths:
  - app/crates
paths-ignore:
  - app/src-tauri
