name: CI / Base scripts snapshot

on:
  push:
    branches: [the-one]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: base-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  base-scripts-cli:
    name: CI / Base scripts snapshot / Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/crates/papyrus-lint-cli

      - name: Build release CLI binary
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: papyrus-linter-cli-linux
          path: app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI
          if-no-files-found: error
          retention-days: 1

  base-scripts-snapshot:
    name: CI / Base scripts snapshot / Compare lint snapshot (${{ matrix.preset }}, ${{ matrix.game }}, extender ${{ matrix.extender }})
    needs: base-scripts-cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [strict, standard, careful]
        game: [skyrim]
        extender: [yes, no]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download CLI binary
        uses: actions/download-artifact@v7
        with:
          name: papyrus-linter-cli-linux
          path: cli-bin

      - name: Make CLI executable
        run: chmod +x cli-bin/PapyrusLinterCLI

      - name: Lint bundled base scripts and compare the baseline
        if: matrix.extender == 'no'
        run: |
          python3 .github/scripts/base_scripts_snapshot.py \
            --cli cli-bin/PapyrusLinterCLI \
            --preset ${{ matrix.preset }} \
            --game ${{ matrix.game }} \
            --work-dir base-scripts-work

      - name: Lint bundled base scripts and compare the baseline
        if: matrix.extender == 'yes'
        run: |
          python3 .github/scripts/base_scripts_snapshot.py \
            --cli cli-bin/PapyrusLinterCLI \
            --preset ${{ matrix.preset }} \
            --game ${{ matrix.game }} \
            --extender \
            --work-dir base-scripts-work
