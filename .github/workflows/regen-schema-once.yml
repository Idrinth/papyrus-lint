name: regen-schema-once
on:
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild rules and schema
        run: |
          python3 .github/scripts/build_rules_json.py
          python3 .github/scripts/generate_config_schema.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema/papyrus-lint.schema.json
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "chore: regenerate papyrus-lint.schema.json"
            git push
          fi
