name: CI / Linters

# shared/rules.json is git-ignored. rustfmt does not run build scripts, but
# clippy does and therefore regenerates the combined rule metadata first.

on:
  push:
    branches: [the-one]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rules-json:
    name: CI / Linters / Rule metadata JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.35.0

      - name: Validate rule metadata schema
        run: check-jsonschema --schemafile schema/papyrus-lint-rule.schema.json shared/rules/*.json

      - name: Check rule metadata invariants
        run: python3 .github/scripts/build_rules_json.py --out /tmp/rules.json

  yaml:
    name: CI / Linters / Rules and links YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Lint YAML sources
        run: yamllint shared/rules/data/*/*.yaml shared/links.yaml

  python-lint:
    name: CI / Linters / Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff==0.14.14

      - name: Lint Python sources
        run: ruff check .github/scripts pages SublimeLinter-contrib-papyrus-lint

  bbcode:
    name: CI / Linters / Nexus page BBCode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Nexus Mods page
        run: python3 .github/scripts/bbcode_lint.py templates/nexuspage.bbcode

  markdown:
    name: CI / Linters / README Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint README files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/README.md'

  markdown-links:
    name: CI / Linters / Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check local Markdown links
        run: python3 .github/scripts/markdown_link_lint.py

  stylelint:
    name: CI / Linters / Frontend CSS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint CSS
        run: npm run lint:css

  frontend:
    name: CI / Linters / Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  rust-fmt:
    name: CI / Linters / Rust fmt (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
        - src-tauri
        - papyrus-parser
        - papyrus-ast-cache
        - papyrus-collision-cache
        - papyrus-lints
        - papyrus-lint-core
        - papyrus-lint-output
        - papyrus-lint-live
        - papyrus-lint-cli
        - papyrus-lint-lsp
        - papyrus-lint-config
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        if: matrix.crate != 'src-tauri'
        run: cargo fmt --manifest-path "app/crates/${{ matrix.crate }}/Cargo.toml" -- --check

      - name: Check formatting
        if: matrix.crate == 'src-tauri'
        run: cargo fmt --manifest-path "app/${{ matrix.crate }}/Cargo.toml" -- --check

  rust-clippy:
    name: CI / Linters / Rust clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
        - src-tauri
        - papyrus-parser
        - papyrus-ast-cache
        - papyrus-collision-cache
        - papyrus-lints
        - papyrus-lint-core
        - papyrus-lint-output
        - papyrus-lint-live
        - papyrus-lint-cli
        - papyrus-lint-lsp
        - papyrus-lint-config
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: matrix.crate != 'src-tauri'
        with:
          workspaces: app/crates/${{ matrix.crate }}

      - uses: Swatinem/rust-cache@v2
        if: matrix.crate == 'src-tauri'
        with:
          workspaces: app/${{ matrix.crate }}

      - name: Clippy
        if: matrix.crate != 'src-tauri'
        run: cargo clippy --manifest-path "app/crates/${{ matrix.crate }}/Cargo.toml" --all-targets -- -D warnings

      - name: Clippy
        if: matrix.crate == 'src-tauri'
        run: cargo clippy --manifest-path "app/${{ matrix.crate }}/Cargo.toml" --all-targets -- -D warnings

  vscode-extension:
    name: CI / Linters / VS Code extension ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
