name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  nexus-page:
    name: Package version-specific Nexus page
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run found for tagged commit ${{ github.sha }}" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --dir coverage-artifacts \
            --pattern '*coverage*'

      - name: Generate version-specific Nexus page
        run: |
          python3 .github/scripts/render_nexuspage.py \
            docs/nexuspage.bbcode \
            coverage-artifacts \
            "nexuspage-${{ github.ref_name }}.bbcode"

      - name: Attach Nexus page to release
        uses: softprops/action-gh-release@v2
        with:
          files: nexuspage-${{ github.ref_name }}.bbcode

  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync app version with release tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');

            const confPath = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

            const pkgPath = 'app/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const vscodePkgPath = 'vscode-extension/package.json';
            const vscodePkg = JSON.parse(fs.readFileSync(vscodePkgPath, 'utf8'));
            vscodePkg.version = version;
            fs.writeFileSync(vscodePkgPath, JSON.stringify(vscodePkg, null, 2) + '\n');

            fs.writeFileSync('SublimeLinter-contrib-papyrus-lint/VERSION', version + '\n');

            const cargoPath = 'app/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));

            const cratesCargoPaths = [
              'app/crates/papyrus-lint-cli/Cargo.toml',
              'app/crates/papyrus-parser/Cargo.toml',
              'app/crates/papyrus-lints/Cargo.toml',
              'app/crates/papyrus-lint-core/Cargo.toml',
            ];
            for (const cratePath of cratesCargoPaths) {
              const crateCargo = fs.readFileSync(cratePath, 'utf8');
              fs.writeFileSync(cratePath, crateCargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
            }
          "

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/crates/papyrus-lint-cli

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Papyrus Lint ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}. See the commit history for details."
          releaseDraft: false
          prerelease: false

      - name: Build CLI
        shell: bash
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Package CLI binary
        shell: bash
        run: |
          mkdir -p cli-dist
          case "${{ matrix.platform }}" in
            windows-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI.exe cli-dist/PapyrusLinterCLI-windows.exe
              ;;
            macos-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-macos
              ;;
            *)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-linux
              ;;
          esac

      - name: Generate default configuration
        if: matrix.platform == 'ubuntu-latest'
        working-directory: cli-dist
        run: ../app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI init

      - name: Upload CLI and default configuration to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" cli-dist/* --clobber --repo "${{ github.repository }}"

  vscode-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Sync plugin versions with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=require('./vscode-extension/package.json'); p.version=process.argv[1]; fs.writeFileSync('./vscode-extension/package.json', JSON.stringify(p, null, 2) + '\\n')" "$VERSION"
          printf '%s\n' "$VERSION" > SublimeLinter-contrib-papyrus-lint/VERSION

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Create Destination Directory
        run: mkdir plugin-dist
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npx @vscode/vsce package --out ../plugin-dist/papyrus-lint-vscode-${{ github.ref_name }}.vsix

      - name: Upload editor plugins to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" plugin-dist/* --clobber --repo "${{ github.repository }}"

  sublime-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Sync plugin versions with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=require('./vscode-extension/package.json'); p.version=process.argv[1]; fs.writeFileSync('./vscode-extension/package.json', JSON.stringify(p, null, 2) + '\\n')" "$VERSION"
          printf '%s\n' "$VERSION" > SublimeLinter-contrib-papyrus-lint/VERSION

      - name: Package SublimeLinter plugin
        run: |
          mkdir -p plugin-dist
          zip -r "plugin-dist/SublimeLinter-contrib-papyrus-lint-${{ github.ref_name }}.zip" SublimeLinter-contrib-papyrus-lint -x '*.gitignore'

      - name: Upload editor plugin to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" plugin-dist/* --clobber --repo "${{ github.repository }}"

  release-notes:
    name: Write release notes
    needs:
    - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v -F -x "${{ github.ref_name }}" \
            | head -n1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          echo "## Changes" > changelist.md
          echo >> changelist.md
          : > nexus-changelog.md

          declare -A SEEN
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            PRS=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | "\(.number)\t\(.title)\t\(.html_url)"' 2>/dev/null || true)
            while IFS=$'\t' read -r number title url; do
              [ -z "$number" ] && continue
              if [ -z "${SEEN[$number]:-}" ]; then
                SEEN[$number]=1
                echo "- [#$number]($url) $title" >> changelist.md
                echo "- $title" >> nexus-changelog.md
              fi
            done <<< "$PRS"
          done

      - name: Upload Nexus changelog
        uses: actions/upload-artifact@v7
        with:
          name: nexus-changelog
          path: nexus-changelog.md
          retention-days: 1

      - name: Resolve tagged commit SHA
        id: tag_sha
        run: echo "sha=$(git rev-list -n1 ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.tag_sha.outputs.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -D coverage-artifacts \
            -p '*coverage*'

      - name: Build coverage summary
        run: |
          if [ -d coverage-artifacts ]; then
            python3 .github/scripts/coverage_summary.py coverage-artifacts | tail -n +2 > coverage.md
          else
            echo "_Coverage data unavailable: no successful CI run found for this commit._" > coverage.md
          fi

      - name: Assemble release notes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          {
            cat changelist.md
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$CURRENT"
              echo
            fi
            cat coverage.md
          } > release-notes.md

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"

  nexus-upload:
    name: Publish release to Nexus Mods
    needs: 
      - vscode-plugin
      - sublime-plugin
      - release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      NEXUS_API: https://api.nexusmods.com/v3
      MOD_ID: "189862"
    steps:
      - name: Download Nexus changelog
        uses: actions/download-artifact@v8
        with:
          name: nexus-changelog

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir nexus-dist \
            -p '*setup.exe' \
            -p 'PapyrusLinterCLI-windows.exe' \
            -p 'papyrus-lint.yaml' \
            -p 'SublimeLinter-contrib-papyrus-lint-*.zip' \
            -p 'papyrus-lint-vscode-*.vsix'

      - name: Zip default config
        run: |
          cd nexus-dist
          zip ../config.zip papyrus-lint.yaml

      - name: Zip vscode plugin
        run: |
          cd nexus-dist
          zip ../vscode.zip papyrus-lint-vscode-*.vsix

      - name: Rename files for easier usage
        run: |
          cd nexus-dist
          mv ./*setup.exe ../setup.exe
          mv SublimeLinter* ../sublime.zip
          mv PapyrusLinterCLI-windows.exe ../cli.exe

      - name: Upload to NexusMods (setup)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7873554"
          filename: setup.exe
          version: ${{ github.ref_name }}
          category: main
          display_name: "PapyrusLinter (Windows)"
          update_mod_version: true
          allow_mod_manager_download: false
          primary_mod_manager_download: true
          description: "Windows GUI executable, for other operating systems see github release."
      - name: Upload to NexusMods (cli)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7890633"
          filename: cli.exe
          version: ${{ github.ref_name }}
          category: main
          display_name: "PapyrusLinterCLI (Windows)"
          allow_mod_manager_download: false
          description: "Windows CLI executable, for other operating systems see github release."
      - name: Upload to NexusMods (config)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881441"
          filename: config.zip
          version: ${{ github.ref_name }}
          category: miscellaneous
          display_name: "Papyrus Lint Default Config"
          allow_mod_manager_download: true
          description: "If you want to create your own presets start from here."
      - name: Upload to NexusMods (vscode)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881354"
          filename: vscode.zip
          version: ${{ github.ref_name }}
          category: optional
          display_name: "Papyrus Lint Vscode Extension"
          allow_mod_manager_download: false
          description: "Requires one of the executables from main."
      - name: Upload to NexusMods (sublime)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881339"
          filename: sublime.zip
          version: ${{ github.ref_name }}
          category: optional
          display_name: "Papyrus Lint SublimeLinter Plugin"
          allow_mod_manager_download: false
          description: "Requires one of the executables from main."
