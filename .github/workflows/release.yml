name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  container:
    name: Publish CLI container (${{ matrix.preset }}) for ${{ matrix.game }}
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        preset: [strict, standard, careful]
        game: [skyrim]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Provide scripts as expected
        run: cp shared/${{ matrix.game }}-scripts.zip docker/Scripts.zip

      - name: Download released Linux CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag's release assets are attached by release.yml's platform
          # matrix; retry a few times so a fast tag push does not race it.
          i=0
          until gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern PapyrusLinterCLI-linux \
            --dir docker; do
            i=$((i + 1))
            if [ "$i" -ge 12 ]; then
              echo "PapyrusLinterCLI-linux was not attached to $GITHUB_REF_NAME" >&2
              exit 1
            fi
            sleep 10
          done
          mv docker/PapyrusLinterCLI-linux docker/PapyrusLinterCLI

      - name: Resolve lowercase container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve container tags
        id: tags
        shell: bash
        run: |
          name="${{ steps.image.outputs.name }}"
          preset="${{ matrix.preset }}"
          game="${{ matrix.game }}"
          tag="${{ github.ref_name }}"
          {
            echo "list<<EOF"
            echo "$name:$tag-$game-$preset"
            echo "$name:$game-$preset"
            if [ "$preset" = strict ]; then
              echo "$name:$game-$tag"
              echo "$name:$game-latest"
            fi
            if [ "$game" = skyrim ]; then
              echo "$name:$tag-$preset"
              echo "$name:$preset"
              if [ "$preset" = strict ]; then
                echo "$name:$tag"
                echo "$name:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          build-args: |
            PRESET=${{ matrix.preset }}
          tags: ${{ steps.tags.outputs.list }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign and verify container image
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"

  nexus-page:
    name: Package version-specific Nexus page
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run found for tagged commit ${{ github.sha }}" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --dir coverage-artifacts \
            --pattern '*coverage*'

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - name: Regenerate Nexus page lint tables from rules.json
        run: python3 .github/scripts/generate_nexuspage_tables.py shared/rules.json docs/nexuspage.bbcode

      - name: Generate version-specific Nexus page
        run: |
          python3 .github/scripts/render_nexuspage.py \
            docs/nexuspage.bbcode \
            coverage-artifacts \
            "nexuspage-${{ github.ref_name }}.bbcode" \
            "${{ github.ref_name }}"

      - name: Attach Nexus page to release
        uses: softprops/action-gh-release@v3
        with:
          files: nexuspage-${{ github.ref_name }}.bbcode

  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        shell: bash
        run: python3 .github/scripts/build_rules_json.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync app version with release tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');

            const confPath = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

            const pkgPath = 'app/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const vscodePkgPath = 'vscode-extension/package.json';
            const vscodePkg = JSON.parse(fs.readFileSync(vscodePkgPath, 'utf8'));
            vscodePkg.version = version;
            fs.writeFileSync(vscodePkgPath, JSON.stringify(vscodePkg, null, 2) + '\n');

            fs.writeFileSync('SublimeLinter-contrib-papyrus-lint/VERSION', version + '\n');

            const cargoPath = 'app/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));

            const cratesCargoPaths = [
              'app/crates/papyrus-lint-cli/Cargo.toml',
              'app/crates/papyrus-parser/Cargo.toml',
              'app/crates/papyrus-lints/Cargo.toml',
              'app/crates/papyrus-lint-config/Cargo.toml',
              'app/crates/papyrus-lint-core/Cargo.toml',
              'app/crates/papyrus-lint-output/Cargo.toml',
              'app/crates/papyrus-ast-cache/Cargo.toml',
            ];
            for (const cratePath of cratesCargoPaths) {
              const crateCargo = fs.readFileSync(cratePath, 'utf8');
              fs.writeFileSync(cratePath, crateCargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
            }
          "

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/crates/papyrus-lint-cli

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}. See the commit history for details."
          releaseDraft: false
          prerelease: false
          # Drop [version] from the uploaded bundle names (Tauri's default
          # naming includes it) so a releases/latest/download/<name> link
          # keeps pointing at the right file across releases.
          releaseAssetNamePattern: "[name]-[platform]-[arch][_setup][ext]"

      - name: Build CLI
        shell: bash
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Package CLI binary
        shell: bash
        run: |
          mkdir -p cli-dist hash-binaries
          case "${{ matrix.platform }}" in
            windows-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI.exe cli-dist/PapyrusLinterCLI-windows.exe
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI.exe hash-binaries/PapyrusLinterCLI-windows.exe
              cp app/src-tauri/target/release/PapyrusLinter.exe hash-binaries/PapyrusLinter-windows.exe
              ;;
            macos-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-macos
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI hash-binaries/PapyrusLinterCLI-macos
              cp app/src-tauri/target/release/PapyrusLinter hash-binaries/PapyrusLinter-macos
              ;;
            *)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-linux
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI hash-binaries/PapyrusLinterCLI-linux
              cp app/src-tauri/target/release/PapyrusLinter hash-binaries/PapyrusLinter-linux
              ;;
          esac

      - name: Upload hash binaries for plugin packaging
        uses: actions/upload-artifact@v7
        with:
          name: hash-binaries-${{ matrix.platform }}
          path: hash-binaries/*
          if-no-files-found: error

      - name: Copy default configuration
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: cp configuration/papyrus-lint.default.yaml cli-dist/papyrus-lint.yaml

      - name: Upload CLI and default configuration to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" cli-dist/* --clobber --repo "${{ github.repository }}"

  vscode-plugin:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release binaries for hash baking
        uses: actions/download-artifact@v8
        with:
          pattern: hash-binaries-*
          merge-multiple: true
          path: hash-binaries

      - name: Bake CLI and GUI SHA-256 digests into the plugin
        run: python3 .github/scripts/write_cli_hashes.py hash-binaries

      - name: Sync plugin versions with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=require('./vscode-extension/package.json'); p.version=process.argv[1]; fs.writeFileSync('./vscode-extension/package.json', JSON.stringify(p, null, 2) + '\\n')" "$VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Create Destination Directory
        run: mkdir plugin-dist
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          cp ../LICENSE LICENSE
          cp ../shared/images/logo-small.jpg logo.jpg
          npm ci
          npx @vscode/vsce package --out ../plugin-dist/papyrus-lint-vscode.vsix
          npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
          rm LICENSE logo.jpg

      - name: Upload editor plugins to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" plugin-dist/* --clobber --repo "${{ github.repository }}"

  sublime-plugin:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release binaries for hash baking
        uses: actions/download-artifact@v8
        with:
          pattern: hash-binaries-*
          merge-multiple: true
          path: hash-binaries

      - name: Bake CLI and GUI SHA-256 digests into the plugin
        run: python3 .github/scripts/write_cli_hashes.py hash-binaries

      - name: Sync plugin versions with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > SublimeLinter-contrib-papyrus-lint/VERSION

      - name: Package SublimeLinter plugin
        run: |
          mkdir -p plugin-dist
          zip -r "plugin-dist/SublimeLinter-contrib-papyrus-lint.zip" SublimeLinter-contrib-papyrus-lint \
            -x '*.gitignore' 'SublimeLinter-contrib-papyrus-lint/tests/*'

      - name: Upload editor plugin to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" plugin-dist/* --clobber --repo "${{ github.repository }}"

  sign-release-assets:
    name: Sign release assets
    needs:
      - release
      - sublime-plugin
      - vscode-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Sign and verify release assets
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          files2sign=(
            "PapyrusLinterCLI-linux"
            "PapyrusLinterCLI-macos"
            "PapyrusLinterCLI-windows.exe"
            "PapyrusLinter-windows-x64_setup.exe"
            "PapyrusLinter-windows-x64.msi"
            "PapyrusLinter-linux-x86_64.rpm"
            "PapyrusLinter-linux-amd64.deb"
            "PapyrusLinter-linux-amd64.AppImage"
            "PapyrusLinter-darwin-aarch64.dmg"
            "PapyrusLinter-darwin-aarch64.app.tar.gz"
            "papyrus-lint-vscode.vsix"
            "SublimeLinter-contrib-papyrus-lint.zip"
          )
          mkdir signatures
          missing=0
          for name in "${files2sign[@]}"; do
            bundle="signatures/${name}.sigstore.json"
            asset="release-assets/${name}"
            if [ ! -f "$asset" ]; then
              echo "::error::Expected release asset '$name' was not downloaded; a sign-release-assets dependency may be missing." >&2
              missing=1
            else
              cosign sign-blob --yes --bundle "$bundle" "$asset"
              cosign verify-blob \
                --bundle "$bundle" \
                --certificate-identity "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$asset"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Upload signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "signatures/*.sigstore.json" --clobber --repo "${{ github.repository }}"

  virustotal-scan:
    name: Scan release assets with VirusTotal
    needs:
      - sign-release-assets
      - release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release ID
        id: release_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id)
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Download release executables and archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p scan-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir scan-assets \
            -p "PapyrusLinterCLI-linux" \
            -p "PapyrusLinterCLI-macos" \
            -p "PapyrusLinterCLI-windows.exe" \
            -p "PapyrusLinter-windows-x64_setup.exe" \
            -p "PapyrusLinter-windows-x64.msi" \
            -p "PapyrusLinter-linux-x86_64.rpm" \
            -p "PapyrusLinter-linux-amd64.deb" \
            -p "PapyrusLinter-linux-amd64.AppImage" \
            -p "PapyrusLinter-darwin-aarch64.dmg" \
            -p "PapyrusLinter-darwin-aarch64.app.tar.gz" \
            -p "papyrus-lint-vscode.vsix" \
            -p "SublimeLinter-contrib-papyrus-lint.zip"

      # Runs after release-notes so its own release-notes-editing step (which
      # rewrites the notes wholesale) can't clobber the results this appends;
      # update_release: true is what gives the release notes their "quick
      # result overview" of the scan, and summary: true mirrors it into this
      # job's own step summary.
      - name: VirusTotal Action
        uses: cssnr/virustotal-action@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          file_globs: scan-assets/*
          release_id: ${{ steps.release_id.outputs.id }}
          sha256: true
          update_release: true

  update-pages:
    name: Update GitHub Pages with release version
    needs:
    - virustotal-scan
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Pages rebuild on the-one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # pages.yml deploys to the "github-pages" environment, whose
          # deployment branch policy only allows the-one. Calling it as a
          # workflow_call from this tag-triggered workflow runs it on the
          # tag's ref instead of a branch, which GitHub then refuses to
          # deploy ("Branch/tag not allowed to deploy to github-pages due
          # to environment protection rules"). Dispatching it as its own
          # run on the-one keeps the ref a branch, so the deploy is
          # actually allowed, while still passing this tag as the version
          # to display.
          #
          # RELEASE_TAG is read from the environment rather than
          # interpolating ${{ github.ref_name }} directly into the shell
          # command, so a tag name can't inject shell syntax.
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref the-one \
            -f version="$RELEASE_TAG"

  release-notes:
    name: Write release notes
    needs:
    - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v -F -x "${{ github.ref_name }}" \
            | head -n1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          # Component labels, in the order their sections appear. A pull
          # request carrying multiple component labels is listed under every
          # matching section. "component: documentation" is not a section,
          # so a pull request labeled with it and another component is still
          # grouped under each of its other components rather than dropped.
          # Documentation changes are tracked elsewhere, so a pull request
          # whose only matching label is documentation is left out of the
          # release notes entirely instead of falling into "Other".
          LABEL_KEYS=(
            "component: sublime lint plugin"
            "component: vscode extension"
            "component: frontend"
            "component: linting"
            "component: ci"
            "component: parsing"
            "component: pages"
            "component: gui"
            "component: cli"
            "component: reporting"
          )
          LABEL_HEADINGS=(
            "Sublime Text Plugin"
            "VS Code Extension"
            "Frontend"
            "Linting"
            "CI"
            "Parsing"
            "Pages"
            "GUI"
            "CLI"
            "Reporting"
          )
          DOC_LABEL="component: documentation"

          # Labels that mark a pull request as invisible to someone just
          # downloading the mod from Nexus, regardless of what else it's
          # labeled: excluded from nexus-changelog.md only, not from the
          # GitHub release notes above (which still group ci/pages PRs
          # under their own headings for repo-side visibility).
          NEXUS_EXCLUDE_LABELS=(
            "type: tests"
            "type: documentation"
            "type: dependency"
            "component: pages"
            "component: ci"
            "component: documentation"
          )

          WORKDIR=$(mktemp -d)
          for i in "${!LABEL_KEYS[@]}"; do
            : > "$WORKDIR/group_$i.md"
          done
          : > "$WORKDIR/other.md"
          : > nexus-changelog.md

          declare -A SEEN
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            PRS=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | "\(.number)\t\(.title)\t\(.html_url)\t\((.labels // []) | map(.name) | join(","))"' 2>/dev/null || true)
            while IFS=$'\t' read -r number title url labels_csv; do
              [ -z "$number" ] && continue
              [ -n "${SEEN[$number]:-}" ] && continue
              SEEN[$number]=1

              IFS=',' read -ra PR_LABELS <<< "$labels_csv"
              matched_indices=()
              is_doc=0
              nexus_excluded=0
              type_labels=()
              for l in "${PR_LABELS[@]}"; do
                [ "$l" == "$DOC_LABEL" ] && is_doc=1
                if [[ "$l" == "type: "* ]]; then
                  type_labels+=("$(echo "${l#type: }" \
                    | awk '{for (i = 1; i <= NF; i++) $i = toupper(substr($i, 1, 1)) substr($i, 2)}1')")
                fi
                for i in "${!LABEL_KEYS[@]}"; do
                  if [ "$l" == "${LABEL_KEYS[$i]}" ]; then
                    matched_indices+=("$i")
                  fi
                done
                for ex in "${NEXUS_EXCLUDE_LABELS[@]}"; do
                  [ "$l" == "$ex" ] && nexus_excluded=1
                done
              done

              type_tag=""
              if [ "${#type_labels[@]}" -gt 0 ]; then
                joined=$(printf ", %s" "${type_labels[@]}")
                type_tag="[${joined:2}] "
              fi

              # Wrap any "@name"/"@org/team" mention in the PR title in
              # backticks before it lands in the GitHub release notes, so it
              # renders as literal text instead of GitHub turning it into a
              # user/team mention (and notifying them). The plain-text Nexus
              # changelog below keeps the raw title, since backticks would
              # just show up literally there.
              release_title=$(printf '%s' "$title" | sed -E 's/@([A-Za-z0-9](-?[A-Za-z0-9\/])*)/`&`/g')

              if [ "${#matched_indices[@]}" -eq 0 ]; then
                if [ "$is_doc" -eq 1 ]; then
                  continue
                fi
                echo "- [#$number]($url) ${type_tag}$release_title" >> "$WORKDIR/other.md"
              else
                for i in "${matched_indices[@]}"; do
                  echo "- [#$number]($url) ${type_tag}$release_title" >> "$WORKDIR/group_$i.md"
                done
              fi
              if [ "$nexus_excluded" -eq 0 ]; then
                echo "$title" >> nexus-changelog.md
              fi
            done <<< "$PRS"
          done

          echo "## Changes" > changelist.md
          echo >> changelist.md
          for i in "${!LABEL_KEYS[@]}"; do
            if [ -s "$WORKDIR/group_$i.md" ]; then
              echo "### ${LABEL_HEADINGS[$i]}" >> changelist.md
              echo >> changelist.md
              cat "$WORKDIR/group_$i.md" >> changelist.md
              echo >> changelist.md
            fi
          done
          if [ -s "$WORKDIR/other.md" ]; then
            echo "### Other" >> changelist.md
            echo >> changelist.md
            cat "$WORKDIR/other.md" >> changelist.md
            echo >> changelist.md
          fi

      - name: Upload Nexus changelog
        uses: actions/upload-artifact@v7
        with:
          name: nexus-changelog
          path: nexus-changelog.md
          retention-days: 1

      - name: Resolve tagged commit SHA
        id: tag_sha
        run: echo "sha=$(git rev-list -n1 ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.tag_sha.outputs.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -D coverage-artifacts \
            -p '*coverage*'

      - name: Build coverage summary
        run: |
          if [ -d coverage-artifacts ]; then
            python3 .github/scripts/coverage_summary.py coverage-artifacts | tail -n +2 > coverage.md
          else
            echo "_Coverage data unavailable: no successful CI run found for this commit._" > coverage.md
          fi

      - name: Assemble release notes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          {
            cat changelist.md
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$CURRENT"
              echo
            fi
            cat coverage.md
          } > release-notes.md

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"

  nexus-upload:
    name: Publish release to Nexus Mods
    needs: 
      - virustotal-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      NEXUS_API: https://api.nexusmods.com/v3
      MOD_ID: "7318624462246"
    steps:
      - name: Download Nexus changelog
        uses: actions/download-artifact@v8
        with:
          name: nexus-changelog

      - name: Read Nexus changelog
        id: nexus_changelog
        run: |
          # Nexus's changelog field caps at 65535 characters (see the
          # AddModChangelogEntriesRequest schema at
          # https://api.nexusmods.com/openapi.yaml); truncate defensively so
          # an unusually large release can't make the upload fail outright.
          MAX_CHANGELOG_BYTES=65000
          if [ "$(wc -c < nexus-changelog.md)" -gt "$MAX_CHANGELOG_BYTES" ]; then
            head -c "$MAX_CHANGELOG_BYTES" nexus-changelog.md > nexus-changelog.truncated.md
            printf '\n... (truncated; see the GitHub release notes for the full changelist)\n' \
              >> nexus-changelog.truncated.md
            mv nexus-changelog.truncated.md nexus-changelog.md
          fi
          {
            echo "changelog<<NEXUS_CHANGELOG_EOF"
            cat nexus-changelog.md
            echo "NEXUS_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir nexus-dist \
            -p '*setup.exe' \
            -p 'PapyrusLinterCLI-windows.exe' \
            -p 'papyrus-lint.yaml' \
            -p 'SublimeLinter-contrib-papyrus-lint.zip' \
            -p 'papyrus-lint-vscode.vsix'

      - name: Zip default config
        run: |
          cd nexus-dist
          zip ../config.zip papyrus-lint.yaml

      - name: Zip vscode plugin
        run: |
          cd nexus-dist
          zip ../vscode.zip papyrus-lint-vscode.vsix

      - name: Rename files for easier usage
        run: |
          cd nexus-dist
          mv ./*setup.exe ../setup.exe
          mv SublimeLinter-contrib-papyrus-lint.zip ../sublime.zip
          mv PapyrusLinterCLI-windows.exe ../cli.exe

      - name: Upload to NexusMods (setup)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7873554"
          filename: setup.exe
          version: ${{ github.ref_name }}
          category: main
          display_name: "PapyrusLinter (Windows)"
          update_mod_version: true
          allow_mod_manager_download: false
          primary_mod_manager_download: true
          description: "Windows GUI executable, for other operating systems see github release."
          mod_id: ${{ env.MOD_ID }}
          changelog: ${{ steps.nexus_changelog.outputs.changelog }}
      - name: Upload to NexusMods (cli)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7890633"
          filename: cli.exe
          version: ${{ github.ref_name }}
          category: main
          display_name: "PapyrusLinterCLI (Windows)"
          allow_mod_manager_download: false
          description: "Windows CLI executable, for other operating systems see github release."
      - name: Upload to NexusMods (config)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881441"
          filename: config.zip
          version: ${{ github.ref_name }}
          category: miscellaneous
          display_name: "Papyrus Lint Default Config"
          allow_mod_manager_download: true
          description: "If you want to create your own presets start from here."
      - name: Upload to NexusMods (vscode)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881354"
          filename: vscode.zip
          version: ${{ github.ref_name }}
          category: optional
          display_name: "Papyrus Lint Vscode Extension"
          allow_mod_manager_download: false
          description: "Requires one of the executables from main, if not provided will download one from the github release."
      - name: Upload to NexusMods (sublime)
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: "7881339"
          filename: sublime.zip
          version: ${{ github.ref_name }}
          category: optional
          display_name: "Papyrus Lint SublimeLinter Plugin"
          allow_mod_manager_download: false
          description: "Requires one of the executables from main, if not provided will download one from the github release."
