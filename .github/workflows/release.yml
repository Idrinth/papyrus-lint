name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync app version with release tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');

            const confPath = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

            const pkgPath = 'app/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const cargoPath = 'app/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));

            const cratesCargoPaths = [
              'app/crates/papyrus-lint-cli/Cargo.toml',
              'app/crates/papyrus-parser/Cargo.toml',
              'app/crates/papyrus-lints/Cargo.toml',
              'app/crates/papyrus-lint-core/Cargo.toml',
            ];
            for (const cratePath of cratesCargoPaths) {
              const crateCargo = fs.readFileSync(cratePath, 'utf8');
              fs.writeFileSync(cratePath, crateCargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
            }
          "

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/crates/papyrus-lint-cli

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Papyrus Lint ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}. See the commit history for details."
          releaseDraft: false
          prerelease: false

      - name: Build CLI
        shell: bash
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Package CLI binary
        shell: bash
        run: |
          mkdir -p cli-dist
          case "${{ matrix.platform }}" in
            windows-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI.exe cli-dist/PapyrusLinterCLI-windows.exe
              ;;
            macos-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-macos
              ;;
            *)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-linux
              ;;
          esac

      - name: Upload CLI binary to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" cli-dist/* --clobber --repo "${{ github.repository }}"

  editor-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Create Destination Directory
        run: mkdir plugin-dist
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npx @vscode/vsce package --out ../plugin-dist/papyrus-lint-vscode-${{ github.ref_name }}.vsix

      - name: Package SublimeLinter plugin
        run: |
          mkdir -p plugin-dist
          zip -r "plugin-dist/SublimeLinter-contrib-papyrus-lint-${{ github.ref_name }}.zip" SublimeLinter-contrib-papyrus-lint -x '*.gitignore'

      - name: Upload editor plugins to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" plugin-dist/* --clobber --repo "${{ github.repository }}"

  release-notes:
    name: Write release notes
    needs: [release, editor-plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v -F -x "${{ github.ref_name }}" \
            | head -n1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          echo "## Changes" > changelist.md
          echo >> changelist.md

          declare -A SEEN
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            PRS=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | "\(.number)\t\(.title)\t\(.html_url)"' 2>/dev/null || true)
            while IFS=$'\t' read -r number title url; do
              [ -z "$number" ] && continue
              if [ -z "${SEEN[$number]:-}" ]; then
                SEEN[$number]=1
                echo "- [$title]($url)" >> changelist.md
              fi
            done <<< "$PRS"
          done

      - name: Resolve tagged commit SHA
        id: tag_sha
        run: echo "sha=$(git rev-list -n1 ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.tag_sha.outputs.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -D coverage-artifacts \
            -p '*coverage*'

      - name: Build coverage summary
        run: |
          if [ -d coverage-artifacts ]; then
            python3 .github/scripts/coverage_summary.py coverage-artifacts | tail -n +2 > coverage.md
          else
            echo "_Coverage data unavailable: no successful CI run found for this commit._" > coverage.md
          fi

      - name: Assemble release notes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          {
            cat changelist.md
            echo
            cat coverage.md
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$CURRENT"
            fi
          } > release-notes.md

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"
