name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync app version with release tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');

            const confPath = 'app/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

            const pkgPath = 'app/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

            const cargoPath = 'app/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));

            const cratesCargoPaths = [
              'app/crates/papyrus-lint-cli/Cargo.toml',
              'app/crates/papyrus-parser/Cargo.toml',
              'app/crates/papyrus-lints/Cargo.toml',
              'app/crates/papyrus-lint-core/Cargo.toml',
            ];
            for (const cratePath of cratesCargoPaths) {
              const crateCargo = fs.readFileSync(cratePath, 'utf8');
              fs.writeFileSync(cratePath, crateCargo.replace(/^version = \".*\"/m, \`version = \"\${version}\"\`));
            }
          "

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/crates/papyrus-lint-cli

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Papyrus Lint ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}. See the commit history for details."
          releaseDraft: false
          prerelease: false

      - name: Build CLI
        shell: bash
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Package CLI binary
        shell: bash
        run: |
          mkdir -p cli-dist
          case "${{ matrix.platform }}" in
            windows-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI.exe cli-dist/PapyrusLinterCLI-windows.exe
              ;;
            macos-latest)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-macos
              ;;
            *)
              cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI cli-dist/PapyrusLinterCLI-linux
              ;;
          esac

      - name: Generate default configuration
        if: matrix.platform == 'ubuntu-latest'
        working-directory: cli-dist
        run: ../app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI init

      - name: Upload CLI and default configuration to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" cli-dist/* --clobber --repo "${{ github.repository }}"

  editor-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Create Destination Directory
        run: mkdir plugin-dist
      - name: Package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npx @vscode/vsce package --out ../plugin-dist/papyrus-lint-vscode-${{ github.ref_name }}.vsix

      - name: Package SublimeLinter plugin
        run: |
          mkdir -p plugin-dist
          zip -r "plugin-dist/SublimeLinter-contrib-papyrus-lint-${{ github.ref_name }}.zip" SublimeLinter-contrib-papyrus-lint -x '*.gitignore'

      - name: Upload editor plugins to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" plugin-dist/* --clobber --repo "${{ github.repository }}"

  release-notes:
    name: Write release notes
    needs: [release, editor-plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v -F -x "${{ github.ref_name }}" \
            | head -n1)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          echo "## Changes" > changelist.md
          echo >> changelist.md
          : > nexus-changelog.md

          declare -A SEEN
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            PRS=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | "\(.number)\t\(.title)\t\(.html_url)"' 2>/dev/null || true)
            while IFS=$'\t' read -r number title url; do
              [ -z "$number" ] && continue
              if [ -z "${SEEN[$number]:-}" ]; then
                SEEN[$number]=1
                echo "- [#$number]($url) $title" >> changelist.md
                echo "- $title" >> nexus-changelog.md
              fi
            done <<< "$PRS"
          done

      - name: Upload Nexus changelog
        uses: actions/upload-artifact@v7
        with:
          name: nexus-changelog
          path: nexus-changelog.md
          retention-days: 1

      - name: Resolve tagged commit SHA
        id: tag_sha
        run: echo "sha=$(git rev-list -n1 ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"

      - name: Find CI coverage run for tagged commit
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.tag_sha.outputs.sha }}&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -D coverage-artifacts \
            -p '*coverage*'

      - name: Build coverage summary
        run: |
          if [ -d coverage-artifacts ]; then
            python3 .github/scripts/coverage_summary.py coverage-artifacts | tail -n +2 > coverage.md
          else
            echo "_Coverage data unavailable: no successful CI run found for this commit._" > coverage.md
          fi

      - name: Assemble release notes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          {
            cat changelist.md
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$CURRENT"
              echo
            fi
            cat coverage.md
          } > release-notes.md

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"

  nexus-upload:
    name: Publish release to Nexus Mods
    needs: [release, editor-plugins, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      NEXUS_API: https://api.nexusmods.com/v3
      MOD_ID: "189862"
    steps:
      - name: Download Nexus changelog
        uses: actions/download-artifact@v7
        with:
          name: nexus-changelog

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir nexus-dist \
            -p '*setup.exe' \
            -p 'PapyrusLinterCLI-windows.exe' \
            -p 'papyrus-lint.yaml' \
            -p 'SublimeLinter-contrib-papyrus-lint-*.zip' \
            -p 'papyrus-lint-vscode-*.vsix'

      - name: Zip default config
        run: |
          cd nexus-dist
          zip papyrus-lint-config.zip papyrus-lint.yaml

      - name: Post changelog to Nexus
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          jq -n --arg version "$version" --rawfile changelog nexus-changelog.md \
              '{version: $version, changelog: $changelog}' \
            | curl -sS -f -X POST "$NEXUS_API/mods/$MOD_ID/changelogs" \
                -H "apikey: $NEXUSMODS_API_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null

      - name: Upload files to Nexus
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"

          # $1 group_id, $2 file path, $3 mod-file display name, $4 file_category,
          # $5 (optional) extra "key":value pairs merged into the create-version request
          upload_file() {
            local group_id="$1" file="$2" name="$3" category="$4" extra="${5:-}"
            local filename size md5hex md5b64 create_resp upload_id presigned_url state body

            filename=$(basename "$file")
            size=$(stat -c%s "$file")
            md5hex=$(md5sum "$file" | cut -d' ' -f1)
            md5b64=$(openssl dgst -md5 -binary "$file" | base64)

            echo "Uploading $filename (group $group_id)..."

            create_resp=$(jq -n --arg fn "$filename" --argjson sz "$size" --arg md5 "$md5hex" \
                '{filename: $fn, size_bytes: $sz, md5: $md5}' \
              | curl -sS -f -X POST "$NEXUS_API/uploads" \
                  -H "apikey: $NEXUSMODS_API_KEY" \
                  -H "Content-Type: application/json" \
                  --data-binary @-)
            upload_id=$(echo "$create_resp" | jq -r '.data.id')
            presigned_url=$(echo "$create_resp" | jq -r '.data.presigned_url')

            curl -sS -f -X PUT "$presigned_url" \
              -H "Content-Disposition: attachment; filename=\"$filename\"" \
              -H "Content-MD5: $md5b64" \
              --data-binary "@$file" > /dev/null

            curl -sS -f -X POST "$NEXUS_API/uploads/$upload_id/finalise" \
              -H "apikey: $NEXUSMODS_API_KEY" > /dev/null

            state=""
            for _ in $(seq 1 30); do
              state=$(curl -sS -f "$NEXUS_API/uploads/$upload_id" \
                -H "apikey: $NEXUSMODS_API_KEY" | jq -r '.data.state')
              [ "$state" = "available" ] && break
              sleep 5
            done
            if [ "$state" != "available" ]; then
              echo "::error::Upload of $filename never became available (last state: $state)"
              exit 1
            fi

            body=$(jq -n --arg uid "$upload_id" --arg name "$name" --arg version "$version" --arg cat "$category" \
              '{upload_id: $uid, name: $name, version: $version, file_category: $cat}')
            if [ -n "$extra" ]; then
              body=$(echo "$body" | jq ". + {$extra}")
            fi

            curl -sS -f -X POST "$NEXUS_API/mod-files/$group_id/versions" \
              -H "apikey: $NEXUSMODS_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary "$body" > /dev/null
          }

          setup_exe=$(ls nexus-dist/*setup.exe)
          sublime_zip=$(ls nexus-dist/SublimeLinter-contrib-papyrus-lint-*.zip)
          vscode_vsix=$(ls nexus-dist/papyrus-lint-vscode-*.vsix)

          upload_file 7873554 "$setup_exe" "PapyrusLinter (Windows)" main \
            '"primary_mod_manager_download":true,"update_mod_version":true'
          upload_file 7890633 nexus-dist/PapyrusLinterCLI-windows.exe "PapyrusLinterCLI (Windows)" main
          upload_file 7881441 nexus-dist/papyrus-lint-config.zip "Papyrus Lint Default Config" miscellaneous
          upload_file 7881339 "$sublime_zip" "SublimeLinter Plugin" optional
          upload_file 7881354 "$vscode_vsix" "Papyrus Lint Vscode Extension" optional
