name: CI

on:
  push:
    branches: [the-one]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            sed -n '/% Coverage report/,$p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

      - name: Build
        run: npm run build

  vscode-extension:
    name: VS Code extension (test & compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: .

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

  rust-build:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: rust-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: src-tauri
            name: src-tauri
          - crate: crates/papyrus-parser
            name: papyrus-parser
          - crate: crates/papyrus-lints
            name: papyrus-lints
          - crate: crates/papyrus-lint-core
            name: papyrus-lint-core
          - crate: crates/papyrus-lint-cli
            name: papyrus-lint-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Test with coverage
        run: cargo llvm-cov --manifest-path ${{ matrix.crate }}/Cargo.toml --no-report

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Rust coverage — ${{ matrix.name }}"
            echo '```'
            cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ matrix.name }}
          path: lcov.info
