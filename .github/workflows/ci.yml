name: CI

on:
  push:
    branches: [the-one]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            sed -n '/% Coverage report/,$p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

      - name: Build
        run: npm run build

  rust-build:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: rust-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: src-tauri
            name: src-tauri
          - crate: crates/papyrus-parser
            name: papyrus-parser
          - crate: crates/papyrus-lints
            name: papyrus-lints
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Test with coverage
        run: cargo llvm-cov --manifest-path ${{ matrix.crate }}/Cargo.toml --no-report

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Rust coverage — ${{ matrix.name }}"
            echo '```'
            cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ matrix.name }}
          path: lcov.info
