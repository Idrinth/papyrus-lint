name: CI

on:
  push:
    branches: [the-one]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: Rules YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Lint rule files
        run: yamllint rules/*.yaml

  bbcode:
    name: Nexus page BBCode lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test BBCode linter
        run: python3 .github/scripts/test_bbcode_lint.py -v

      - name: Lint Nexus Mods page
        run: python3 .github/scripts/bbcode_lint.py docs/nexuspage.bbcode

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint README files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/README.md'

  sublime-extension:
    name: Sublime Text extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install coverage

      - name: Test with coverage
        run: |
          coverage run --source=SublimeLinter-contrib-papyrus-lint \
            --omit='SublimeLinter-contrib-papyrus-lint/tests/*' \
            -m unittest discover -s SublimeLinter-contrib-papyrus-lint/tests -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Sublime Text extension coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sublime-extension-coverage
          path: lcov.info

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            sed -n '/% Coverage report/,$p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: app/coverage/

      - name: Build
        run: npm run build

  vscode-extension:
    name: VS Code extension (test & compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### VS Code extension coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-coverage
          path: vscode-extension/lcov.info

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

  rust-build:
    name: Rust (fmt, clippy, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: rust-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: app/src-tauri
            name: src-tauri
          - crate: app/crates/papyrus-parser
            name: papyrus-parser
          - crate: app/crates/papyrus-lints
            name: papyrus-lints
          - crate: app/crates/papyrus-lint-core
            name: papyrus-lint-core
          - crate: app/crates/papyrus-lint-cli
            name: papyrus-lint-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'app/src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Test with coverage
        run: cargo llvm-cov --manifest-path ${{ matrix.crate }}/Cargo.toml --no-report

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Rust coverage — ${{ matrix.name }}"
            echo '```'
            cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-${{ matrix.name }}
          path: lcov.info

  coverage-comment:
    name: Coverage summary comment
    if: always() && github.event_name == 'pull_request'
    needs: [sublime-extension, frontend, vscode-extension, rust-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts

      - name: Build coverage summary
        run: python3 .github/scripts/coverage_summary.py coverage-artifacts > coverage-summary.md

      - name: Publish coverage summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary above still carries the report.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-summary-comment -->';
            const body = fs.readFileSync('coverage-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
