name: CI

on:
  push:
    branches: [the-one]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  labels:
    name: Pull request labels
    runs-on: ubuntu-latest
    steps:
      - name: Require component and type labels
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const names = context.payload.pull_request.labels.map((label) => label.name);
            const missing = [];
            if (!names.some((name) => name.startsWith('component: '))) {
              missing.push('a "component: ..." label');
            }
            if (!names.some((name) => name.startsWith('type: '))) {
              missing.push('a "type: ..." label');
            }
            if (missing.length > 0) {
              core.setFailed(`This pull request is missing ${missing.join(' and ')}. See CONTRIBUTING.md for the required labels.`);
            }

  yaml:
    name: Rules YAML lint
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Lint rule files
        run: yamllint rules/*.yaml

  bbcode:
    name: CI scripts and Nexus page BBCode lint
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install coverage
        run: pip install coverage

      - name: Test Nexus page scripts
        run: |
          coverage run --source=.github/scripts --omit='.github/scripts/test_*.py' \
            -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### CI scripts coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-scripts-coverage
          path: lcov.info

      - name: Lint Nexus Mods page
        run: python3 .github/scripts/bbcode_lint.py docs/nexuspage.bbcode

  semver-advisory:
    name: Semantic version advisory
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine latest release tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Collect pull requests merged since the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            RANGE="$TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          : > pull-requests.jsonl
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | {number: .number, title: .title, labels: [.labels[].name]}' \
              >> pull-requests.jsonl 2>/dev/null || true
          done
          jq -s '.' pull-requests.jsonl > pull-requests.json

      - name: Build semantic version advisory
        run: |
          python3 .github/scripts/semver_advisory.py pull-requests.json "${{ steps.latest_tag.outputs.tag }}" \
            > semver-advisory.md

      - name: Publish semantic version advisory
        run: cat semver-advisory.md >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: GitHub Pages builder tests
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install coverage -r pages/requirements-build.txt

      - name: Test site builder with coverage
        run: |
          coverage run --source=pages --omit='pages/test_*.py' \
            -m unittest discover -s pages -p 'test_*.py' -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### GitHub Pages builder coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-coverage
          path: lcov.info

  pages-browser:
    name: GitHub Pages browser smoke test
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Playwright
        run: |
          pip install -r pages/requirements-browser-check.txt -r pages/requirements-build.txt
          playwright install --with-deps chromium

      - name: Build site
        run: python3 pages/build.py --out pages/dist

      - name: Check built site in a browser
        run: python3 pages/browser_check.py --dist pages/dist

  pages-lighthouse:
    name: GitHub Pages Lighthouse check
    if: github.event_name == 'pull_request'
    needs: labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare report directory
        run: mkdir -p lighthouse-reports

      - name: Install dependencies
        run: pip install -r pages/requirements-build.txt

      - name: Build site
        run: python3 pages/build.py --out pages/dist

      - name: Install Lighthouse
        run: npm install -g lighthouse@13.4.1

      - name: Serve built site
        run: |
          python3 -m http.server 4173 --directory pages/dist &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/index.html > /dev/null && break
            sleep 1
          done

      - name: Run Lighthouse against every page
        run: |
          status=0
          while IFS= read -r file; do
            rel="${file#pages/dist/}"
            name=$(echo "$rel" | tr '/.' '__')
            if ! lighthouse "http://localhost:4173/$rel" \
                --output=json --output=html \
                --output-path="lighthouse-reports/$name" \
                --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
                --only-categories=performance,accessibility,best-practices,seo \
                --quiet; then
              echo "::warning::Lighthouse audit failed for $rel"
              status=1
            fi
          done < <(find pages/dist -name '*.html' | sort)
          exit "$status"

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Build Lighthouse summary
        if: always()
        run: python3 .github/scripts/lighthouse_summary.py lighthouse-reports > lighthouse-summary.md

      - name: Publish Lighthouse summary
        if: always()
        run: cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/

      - name: Post Lighthouse comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary above still carries the report.
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-summary-comment -->';
            const body = fs.readFileSync('lighthouse-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  markdown:
    name: Markdown lint
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint README files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/README.md'

  sublime-extension:
    name: Sublime Text extension tests
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install coverage

      - name: Test with coverage
        run: |
          coverage run --source=SublimeLinter-contrib-papyrus-lint \
            --omit='SublimeLinter-contrib-papyrus-lint/tests/*' \
            -m unittest discover -s SublimeLinter-contrib-papyrus-lint/tests -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Sublime Text extension coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sublime-extension-coverage
          path: lcov.info

  stylelint:
    name: Frontend CSS lint
    needs: labels
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint CSS
        run: npm run lint:css

  frontend:
    name: Frontend (typecheck & build)
    needs: labels
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            sed -n '/% Coverage report/,$p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: app/coverage/

      - name: Build
        run: npm run build

  frontend-browser:
    name: Frontend (in-browser layout tests)
    needs: labels
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's Chromium build
        run: npx playwright install --with-deps chromium

      - name: Run in-browser layout tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  app-lighthouse:
    name: Frontend Lighthouse check
    if: github.event_name == 'pull_request'
    needs: labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Prepare report directory
        run: mkdir -p app-lighthouse-reports

      - name: Install Lighthouse
        run: npm install -g lighthouse@13.4.1

      - name: Serve built frontend
        run: |
          python3 -m http.server 4173 --directory app/dist &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/index.html > /dev/null && break
            sleep 1
          done

      - name: Run Lighthouse against every page
        run: |
          status=0
          while IFS= read -r file; do
            rel="${file#app/dist/}"
            name=$(echo "$rel" | tr '/.' '__')
            if ! lighthouse "http://localhost:4173/$rel" \
                --output=json --output=html \
                --output-path="app-lighthouse-reports/$name" \
                --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
                --only-categories=performance,accessibility,best-practices,seo \
                --quiet; then
              echo "::warning::Lighthouse audit failed for $rel"
              status=1
            fi
          done < <(find app/dist -name '*.html' | sort)
          exit "$status"

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Build Lighthouse summary
        if: always()
        run: python3 .github/scripts/lighthouse_summary.py app-lighthouse-reports App > app-lighthouse-summary.md

      - name: Publish Lighthouse summary
        if: always()
        run: cat app-lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-lighthouse-reports
          path: app-lighthouse-reports/

      - name: Post Lighthouse comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary above still carries the report.
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-summary-comment-App -->';
            const body = fs.readFileSync('app-lighthouse-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  vscode-extension:
    name: VS Code extension (test & compile)
    needs: labels
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test with coverage
        run: npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### VS Code extension coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-coverage
          path: vscode-extension/lcov.info

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

  rust-build:
    name: Rust (fmt, clippy, check)
    needs: labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

  rust-test:
    name: Rust test (${{ matrix.name }})
    needs: rust-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: app/src-tauri
            name: src-tauri
          - crate: app/crates/papyrus-parser
            name: papyrus-parser
          - crate: app/crates/papyrus-lints
            name: papyrus-lints
          - crate: app/crates/papyrus-lint-core
            name: papyrus-lint-core
          - crate: app/crates/papyrus-lint-cli
            name: papyrus-lint-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: matrix.crate == 'app/src-tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Test with coverage
        run: cargo llvm-cov --manifest-path ${{ matrix.crate }}/Cargo.toml --no-report

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Rust coverage — ${{ matrix.name }}"
            echo '```'
            cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: cargo llvm-cov report --manifest-path ${{ matrix.crate }}/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-${{ matrix.name }}
          path: lcov.info

  coverage-comment:
    name: Coverage summary comment
    if: always() && github.event_name == 'pull_request'
    needs: [bbcode, pages, sublime-extension, frontend, vscode-extension, rust-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts

      - name: Build coverage summary
        run: python3 .github/scripts/coverage_summary.py coverage-artifacts > coverage-summary.md

      - name: Publish coverage summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary above still carries the report.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-summary-comment -->';
            const body = fs.readFileSync('coverage-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
