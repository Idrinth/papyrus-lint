name: CI

on:
  push:
    branches: [the-one]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: ./.github/workflows/ci-python.yml
    permissions:
      contents: read

  typescript:
    name: TypeScript / JavaScript
    uses: ./.github/workflows/ci-typescript.yml
    permissions:
      contents: read
      pull-requests: write

  rust:
    name: Rust
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read

  semver-advisory:
    name: Semantic version advisory
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine latest release tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Collect pull requests merged since the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if [ -n "$TAG" ]; then
            RANGE="$TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          : > pull-requests.jsonl
          for sha in $(git log "$RANGE" --pretty=format:%H); do
            gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
              --jq '.[] | {number: .number, title: .title, labels: [.labels[].name]}' \
              >> pull-requests.jsonl 2>/dev/null || true
          done
          jq -s '.' pull-requests.jsonl > pull-requests.json

      - name: Find latest successful CI run for coverage data
        id: ci_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=the-one&event=push&status=completed" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -D coverage-artifacts \
            -p '*coverage*'

      - name: Build coverage summary
        run: |
          if [ -d coverage-artifacts ]; then
            python3 .github/scripts/coverage_summary.py coverage-artifacts | tail -n +2 > semver-coverage-summary.md
          else
            echo "_Coverage data unavailable: no successful CI run found yet._" > semver-coverage-summary.md
          fi

      - name: Build semantic version advisory
        run: |
          python3 .github/scripts/semver_advisory.py pull-requests.json "${{ steps.latest_tag.outputs.tag }}" \
            --release-notes semver-release-notes.md \
            --outputs semver-outputs.json \
            --coverage-summary semver-coverage-summary.md \
            > semver-advisory.md

      - name: Publish semantic version advisory
        run: cat semver-advisory.md >> "$GITHUB_STEP_SUMMARY" && cat semver-advisory.md

      - name: Create or update draft release for the detected version jump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: "<!-- semver-advisory: auto-generated draft -->"
        run: |
          NEXT_VERSION=$(jq -r '.next_version // empty' semver-outputs.json)
          if [ -z "$NEXT_VERSION" ]; then
            echo "No version bump recommended; leaving any existing draft release untouched."
            exit 0
          fi

          # Only ever touch a draft release this job created itself (identified
          # by the marker in its body), never one a maintainer drafted by hand.
          EXISTING_TAG=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft) | select((.body // "") | contains(env.MARKER)) | .tag_name' \
            | head -n1)

          if [ -n "$EXISTING_TAG" ] && [ "$EXISTING_TAG" != "$NEXT_VERSION" ]; then
            echo "Recommended version changed from $EXISTING_TAG to $NEXT_VERSION; retargeting the draft release."
            gh release delete "$EXISTING_TAG" --repo "${{ github.repository }}" --yes
            EXISTING_TAG=""
          fi

          if [ -n "$EXISTING_TAG" ]; then
            echo "Updating existing draft release $EXISTING_TAG."
            gh release edit "$EXISTING_TAG" --repo "${{ github.repository }}" \
              --title "$NEXT_VERSION" --notes-file semver-release-notes.md \
              --target "${{ github.sha }}"
          else
            echo "Creating draft release $NEXT_VERSION."
            gh release create "$NEXT_VERSION" --repo "${{ github.repository }}" \
              --title "$NEXT_VERSION" --notes-file semver-release-notes.md \
              --target "${{ github.sha }}" --draft
          fi

  docker-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
          # DL3018 (pin apk package versions) is impractical here: gcompat/
          # libgcc/unzip version numbers track the alpine:3.24 base image's
          # own package repository, which drops old versions as it updates,
          # so a pinned version can vanish out from under an unrelated bump.
          ignore: DL3018

  coverage-comment:
    name: Coverage summary comment
    if: always() && github.event_name == 'pull_request'
    needs: [python, typescript, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts

      - name: Build coverage summary
        run: python3 .github/scripts/coverage_summary.py coverage-artifacts > coverage-summary.md

      - name: Publish coverage summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary above still carries the report.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-summary-comment -->';
            const body = fs.readFileSync('coverage-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  hall-of-shame:
    name: Hall of shame
    # Runs in the same workflow run as the coverage-producing jobs so its
    # uncovered-line ranking always reflects this push, never a lagging
    # prior run's artifacts.
    if: always() && github.event_name == 'pull_request'
    needs: [python, typescript, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts

      - name: Rank files and emit Info notices
        run: python3 .github/scripts/hall_of_shame.py --lcov-dir coverage-artifacts > hall-of-shame.md

      - name: Publish hall of shame
        run: cat hall-of-shame.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post hall of shame comment
        # Forked PRs get a read-only GITHUB_TOKEN, so posting the comment
        # can fail there; the step summary and notice annotations above
        # still carry the report.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hall-of-shame-comment -->';
            const body = fs.readFileSync('hall-of-shame.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
