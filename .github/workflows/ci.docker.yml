name: CI / Docker

# Keep the preset matrix aligned with the images published by release.yml.
# shared/rules.json is git-ignored, so the image build generates it first.

on:
  push:
    branches: [the-one]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-lint:
    name: CI / Docker / Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
          # DL3018 (pin apk package versions) is impractical here: gcompat/
          # libgcc/unzip version numbers track the alpine:3.24 base image's
          # own package repository, which drops old versions as it updates,
          # so a pinned version can vanish out from under an unrelated bump.
          ignore: DL3018

  docker-build:
    name: CI / Docker / Build and smoke-test (${{ matrix.preset }}, ${{ matrix.game }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [strict, standard, careful]
        game: [skyrim]
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/crates/papyrus-lint-cli

      - name: Build release CLI binary
        run: cargo build --release --manifest-path app/crates/papyrus-lint-cli/Cargo.toml

      - name: Stage CLI binary for the image
        run: cp app/crates/papyrus-lint-cli/target/release/PapyrusLinterCLI docker/PapyrusLinterCLI

      - name: Build container image
        uses: docker/build-push-action@v7
        env:
          # Buildx otherwise uploads a "*.dockerbuild" build-summary artifact
          # per matrix leg, which the coverage-comment/hall-of-shame jobs'
          # unfiltered `download-artifact` (elsewhere in this workflow) then
          # trips over.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: docker
          push: false
          load: true
          build-args: |
            PRESET=${{ matrix.preset }}
          tags: papyrus-lint:${{ matrix.preset }}

      - name: Smoke test container image
        run: |
          mkdir -p smoke-project
          cp app/crates/papyrus-lint-core/tests/fixtures/typea.psc smoke-project/

          set +e
          docker run --rm -v "$PWD/smoke-project:/project:ro" papyrus-lint:${{ matrix.preset }}
          status=$?
          set -e
          # 0 = no issues, 1 = lint issues found; either means the container
          # itself ran correctly. Anything else (usage/IO error, crash) fails
          # the job.
          if [ "$status" -ge 2 ]; then
            echo "papyrus-lint container exited with unexpected status $status" >&2
            exit 1
          fi
