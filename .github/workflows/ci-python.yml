name: CI / Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  yaml:
    name: Rules YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Lint YAML sources
        run: yamllint shared/rules/data/*.yaml shared/links.yaml
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff==0.14.14

      - name: Lint Python sources
        run: ruff check .github/scripts pages SublimeLinter-contrib-papyrus-lint
  bbcode:
    name: CI scripts and Nexus page BBCode lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install coverage
        run: pip install coverage

      - name: Test Nexus page scripts
        run: |
          coverage run --source=.github/scripts --omit='.github/scripts/test_*.py' \
            -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### CI scripts coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-scripts-coverage
          path: lcov.info

      - name: Lint Nexus Mods page
        run: python3 .github/scripts/bbcode_lint.py docs/nexuspage.bbcode
  pages:
    name: GitHub Pages builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install coverage -r pages/requirements-build.txt -r pages/requirements-browser-check.txt
          playwright install --with-deps chromium

      - name: Test site builder with coverage
        run: |
          coverage run --source=pages --omit='pages/test_*.py' \
            -m unittest discover -s pages -p 'test_*.py' -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### GitHub Pages builder coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-coverage
          path: lcov.info
  pages-browser:
    name: GitHub Pages browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Playwright
        run: |
          pip install -r pages/requirements-browser-check.txt -r pages/requirements-build.txt
          playwright install --with-deps chromium

      - name: Build site
        run: python3 pages/build.py --out pages/dist

      - name: Check built site in a browser
        run: python3 pages/browser_check.py --dist pages/dist
  sublime-extension:
    name: Sublime Text extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install coverage

      - name: Test with coverage
        run: |
          coverage run --source=SublimeLinter-contrib-papyrus-lint \
            --omit='SublimeLinter-contrib-papyrus-lint/tests/*' \
            -m unittest discover -s SublimeLinter-contrib-papyrus-lint/tests -v

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Sublime Text extension coverage"
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate lcov report
        if: always()
        run: coverage lcov -o lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sublime-extension-coverage
          path: lcov.info
