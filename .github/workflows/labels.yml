name: Pull request labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labels:
    name: Require pull request labels
    runs-on: ubuntu-latest
    steps:
      - name: Require component and type labels
        uses: actions/github-script@v9
        with:
          script: |
            const names = context.payload.pull_request.labels.map((label) => label.name);
            const missing = [];
            if (!names.some((name) => name.startsWith('component: '))) {
              missing.push('a "component: ..." label');
            }
            if (!names.some((name) => name.startsWith('type: '))) {
              missing.push('a "type: ..." label');
            }
            if (missing.length > 0) {
              core.setFailed(`This pull request is missing ${missing.join(' and ')}. See CONTRIBUTING.md for the required labels.`);
            }
