name: GitHub Pages

on:
  push:
    branches: [the-one]
    paths:
      - 'pages/**'
      - 'README.md'
      - 'docs/**'
      - 'resources/**'
      - 'app/src-tauri/icons/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}" 2>/dev/null || echo "")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install -r pages/requirements-build.txt

      - name: Build site
        run: python3 pages/build.py --out pages/dist --version "${{ steps.version.outputs.version }}"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
