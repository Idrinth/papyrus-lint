name: GitHub Pages

# Deploy only for an explicit dispatch, normally release.yml's update-pages
# job. A push trigger could publish unreleased content from the-one while the
# footer still identifies the site as the latest release. Keep workflow_call
# available for callers already running on a Pages-approved branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Manual runs default to the latest release; the release workflow pins
        # the tag so the generated footer describes the artifacts just built.
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}" 2>/dev/null || echo "")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find CI coverage run for the displayed version
        id: ci_run
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Coverage is optional: a missing release or successful CI run leaves
        # the generated coverage page in its "data unavailable" state.
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/commits/${{ steps.version.outputs.version }}" --jq .sha 2>/dev/null || echo "")
          RUN_ID=""
          if [ -n "$SHA" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.tests.yml/runs?head_sha=$SHA&status=completed" \
              --jq '.workflow_runs | map(select(.conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage artifacts
        if: steps.ci_run.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --dir coverage-artifacts \
            --pattern '*coverage*'

      - name: Build rules.json from shared/rules/
        run: python3 .github/scripts/build_rules_json.py

      - name: Install dependencies
        run: pip install -r pages/requirements-build.txt

      - name: Build site
        run: |
          COVERAGE_ARGS=()
          if [ -d coverage-artifacts ]; then
            COVERAGE_ARGS=(--coverage-dir coverage-artifacts)
          fi
          python3 pages/build.py --out pages/dist --version "${{ steps.version.outputs.version }}" "${COVERAGE_ARGS[@]}"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
