name: GitHub Pages

on:
  push:
    branches: [the-one]
    paths:
      - 'pages/**'
      - 'README.md'
      - 'resources/**'
      - 'app/src-tauri/icons/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build site
        run: python3 pages/build.py --out pages/dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
