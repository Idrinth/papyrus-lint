name: GitHub Pages

on:
  push:
    branches: [the-one]
    paths:
      - 'pages/**'
      - 'README.md'
      - 'docs/**'
      - 'resources/**'
      - 'app/src-tauri/icons/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to display on the site (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}" 2>/dev/null || echo "")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: python3 pages/build.py --out pages/dist --version "${{ steps.version.outputs.version }}"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
