# Skyrim's built-in Actor Values, per the CreationKit wiki's "Actor Value"
# page (https://ck.uesp.net/wiki/Actor_Value). Compiled in by
# papyrus-lint-core's build.rs for the "Unknown Actor Value" lint (see
# ../app/crates/papyrus-lints/src/actor_value.rs), which flags a string
# literal passed to an Actor Value function (GetActorValue, SetActorValue,
# ModActorValue, and so on) that doesn't match a name listed here — a
# strong signal of a typo. A mod-added Actor Value defined by a project's
# own plugin has no way to appear here, so this lint is disabled by default
# (see rules.unknown_actor_value).
#
# Each entry is the Actor Value's own case-insensitive name, exactly as
# passed to an Actor Value function.

# Attributes
- Health
- Magicka
- Stamina

