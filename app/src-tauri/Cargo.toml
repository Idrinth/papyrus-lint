[package]
name = "papyrus-lint"
version = "0.1.0"
description = "A linter for Bethesda's papyrus language to improve code quality."
authors = ["Idrinth"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papyrus_lint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "PapyrusLinter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
papyrus-parser = { path = "../crates/papyrus-parser" }
papyrus-lints = { path = "../crates/papyrus-lints" }
papyrus-lint-core = { path = "../crates/papyrus-lint-core" }
papyrus-lint-config = { path = "../crates/papyrus-lint-config" }
papyrus-lint-cli = { path = "../crates/papyrus-lint-cli" }
papyrus-lint-output = { path = "../crates/papyrus-lint-output" }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# papyrus-ast-cache's build.rs parses the bundled Skyrim scripts; see that
# crate's Cargo.toml for why the build-script profile is optimized.
[profile.dev.build-override]
opt-level = 3
