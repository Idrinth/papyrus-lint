[package]
name = "papyrus-lint-config"
version = "0.1.0"
description = "Locates, loads, and saves a project's papyrus-lint.yaml configuration and presets"
authors = ["Idrinth"]
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
papyrus-lints = { path = "../papyrus-lints" }
walkdir = "2"


[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
