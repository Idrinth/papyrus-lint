[package]
name = "papyrus-lint-lsp"
version = "0.1.0"
description = "Stdio language server that surfaces Papyrus Lint diagnostics to LSP editors"
authors = ["Idrinth"]
edition = "2021"

[lib]
name = "papyrus_lint_lsp"
path = "src/lib.rs"

[[bin]]
name = "PapyrusLinterLsp"
path = "src/main.rs"

[dependencies]
papyrus-lint-config = { path = "../papyrus-lint-config" }
papyrus-lints = { path = "../papyrus-lints" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
