[package]
name = "papyrus-lint-cli"
version = "0.1.0"
description = "Command-line interface for linting a project's .achlist scripts against its papyrus-lint.yaml configuration"
authors = ["Idrinth"]
edition = "2021"

[lib]
name = "papyrus_lint_cli"
path = "src/lib.rs"

[[bin]]
name = "PapyrusLinterCLI"
path = "src/main.rs"

[dependencies]
papyrus-parser = { path = "../papyrus-parser" }
papyrus-lints = { path = "../papyrus-lints" }
papyrus-lint-core = { path = "../papyrus-lint-core" }
papyrus-lint-config = { path = "../papyrus-lint-config" }
papyrus-lint-output = { path = "../papyrus-lint-output" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Report color/suggestions are implemented in this crate, not clap's.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[dev-dependencies]
tempfile = "3"

# Applied because this crate is built as its own cargo root (`cargo build
# --manifest-path app/crates/papyrus-lint-cli/Cargo.toml`), so a profile on
# `app/src-tauri` would not reach the standalone CLI binary.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
