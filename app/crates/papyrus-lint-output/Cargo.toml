[package]
name = "papyrus-lint-output"
version = "0.1.0"
description = "Plain-text/JSON/AI-export report formatting shared by PapyrusLinterCLI and the desktop app"
authors = ["Idrinth"]
edition = "2021"

[dependencies]
anstyle-query = "1.1.5"
papyrus-lints = { path = "../papyrus-lints" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
