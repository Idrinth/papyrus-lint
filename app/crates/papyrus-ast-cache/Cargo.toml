[package]
name = "papyrus-ast-cache"
version = "0.1.0"
description = "Disk-backed cache of parsed Papyrus ASTs/token streams, keyed by content MD5, mtime, and linter version"
authors = ["Idrinth"]
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
md5 = "0.7"
bincode = "1"
flate2 = "1"
papyrus-parser = { path = "../papyrus-parser" }
papyrus-lint-globals = { path = "../papyrus-lint-globals" }

[build-dependencies]
papyrus-parser = { path = "../papyrus-parser" }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
md5 = "0.7"
bincode = "1"
flate2 = "1"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# `build.rs` parses ~14k vanilla scripts into the bundled cache. The default
# unoptimized build-script profile turns that into tens of seconds; compiling
# the script itself with optimizations keeps it around a few seconds without
# affecting the crate's own debug codegen.
[profile.dev.build-override]
opt-level = 3
