[package]
name = "papyrus-lints"
version = "0.1.0"
description = "Lint rules for Bethesda's Papyrus scripting language"
authors = ["Idrinth"]
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
papyrus-parser = { path = "../papyrus-parser" }
papyrus-lint-globals = { path = "../papyrus-lint-globals" }

[build-dependencies]
papyrus-lint-globals = { path = "../papyrus-lint-globals" }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_norway = "0.9"
