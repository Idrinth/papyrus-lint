[package]
name = "papyrus-parser"
version = "0.1.0"
description = "Lexer, AST, and parser for Bethesda's Papyrus scripting language"
authors = ["Idrinth"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
papyrus-lint-globals = { path = "../papyrus-lint-globals" }

[dev-dependencies]
serde_json = "1"
