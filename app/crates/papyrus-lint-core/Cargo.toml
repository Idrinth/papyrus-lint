[package]
name = "papyrus-lint-core"
version = "0.1.0"
description = "Shared achlist/config/script-resolution logic used by both the Papyrus Lint desktop app and its CLI"
authors = ["Idrinth"]
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
md5 = "0.7"
similar = "3.2.0"
tempfile = "3"
papyrus-parser = { path = "../papyrus-parser" }
papyrus-lints = { path = "../papyrus-lints" }
papyrus-lint-config = { path = "../papyrus-lint-config" }
papyrus-ast-cache = { path = "../papyrus-ast-cache" }
rayon = "1.12.0"
walkdir = "2"
roxmltree = "0.21.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

# papyrus-ast-cache's build.rs parses the bundled Skyrim scripts; see that
# crate's Cargo.toml for why the build-script profile is optimized.
[profile.dev.build-override]
opt-level = 3
