[package]
name = "papyrus-lint"
version = "0.1.0"
description = "A linter for Bethesda's papyrus language to improve code quality."
authors = ["Idrinth"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papyrus_lint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
papyrus-parser = { path = "../crates/papyrus-parser" }
papyrus-lints = { path = "../crates/papyrus-lints" }
papyrus-lint-core = { path = "../crates/papyrus-lint-core" }
papyrus-lint-cli = { path = "../crates/papyrus-lint-cli" }

[dev-dependencies]
tempfile = "3"
